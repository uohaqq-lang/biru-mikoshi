<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ビル神輿</title>
<link rel="icon" href="data:,"><!-- 空のアイコン：ブラウザが favicon.ico を取りに行って404を出さないように（直す係 第2回・2-2） -->
<!-- 題字の画面の書体（本人が選んだ W3、10/26）：題字は Zen Old Mincho の極太、判の「浅草」は Yuji Boku、「はじめる」は Shippori Mincho B1 の太字。使う字だけを取り寄せる（text=ビル神輿浅草はじめる）。読めなければ明朝で出す -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="ttlFont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@900&family=Yuji+Boku&family=Shippori+Mincho+B1:wght@800&display=block&text=%E3%83%93%E3%83%AB%E7%A5%9E%E8%BC%BF%E6%B5%85%E8%8D%89%E3%81%AF%E3%81%98%E3%82%81%E3%82%8B">
<style>
  :root { --ink:#2b2420; --paper:#f4efe6; --red:#c8322a; --gold:#d9a521; --dim:#8a8079; }
  html,body { margin:0; height:100%; background:#d9d3c7; color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  #view { position:fixed; inset:0; }
  .hud { position:fixed; pointer-events:none; }
  .hud * { pointer-events:auto; }
  #top { top:10px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  #title { background:rgba(244,239,230,.92); border-radius:8px; padding:6px 10px; font-size:13px; line-height:1.5; max-width:60vw; }
  #title b { font-size:15px; }
  #src { color:var(--dim); font-size:11px; }
  #info:empty { display:none; }
  #info { background:rgba(244,239,230,.92); border-radius:8px; padding:6px 10px; font-size:12px; line-height:1.6; text-align:right; min-width:120px; }
  #msg { position:fixed; top:96px; left:50%; transform:translateX(-50%); background:rgba(200,50,42,.94); color:#fff; padding:10px 16px; border-radius:10px; font-size:18px; font-weight:700; text-align:center; line-height:1.45; display:none; pointer-events:none; white-space:nowrap; }
  #msg small { display:block; font-size:13px; font-weight:400; opacity:.95; }
  #hint { position:fixed; top:96px; left:50%; transform:translateX(-50%); background:rgba(43,36,32,.8); color:#fff; padding:8px 14px; border-radius:10px; font-size:14px; display:none; pointer-events:none; white-space:nowrap; }
  #dialWrap { display:none; }
  #rot { position:fixed; right:24px; bottom:160px; display:none; flex-direction:row; gap:8px; }
  #rot button { width:76px; height:48px; padding:0; }
  button { font:inherit; border:none; border-radius:10px; background:var(--paper); color:var(--ink); padding:10px 14px; font-size:15px; box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer; }
  button:active { transform:translateY(1px); }
  #zoom { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; }
  /* 高さの低い画面（スマホの横向き 844×390 など）では、「向き」（下から160px）が右のまん中の＋−と同じ高さになり、「−」を覆った。＋−の左へよける（直す係 第1回・不具合14） */
  /* 縦に積んで細くし、下の「押している間 進む」と上の右上の札の間に収める（名所の説明の札にもかかりにくくする） */
  @media (max-height:500px) { body:not(.sm) #rot { right:66px; bottom:150px; flex-direction:column; } body:not(.sm) #tour:not(.slim) { width:min(560px, 86vw, calc(100vw - 333px)); } }
  /* 縦に積んだ「向き」は、担ぎ始めに開いている右上の担ぎ手の札（下端 約150px）の「担ぎ手 ○人」の行にかかった。
     ボタンを48→42px、間を8→6pxに詰め、下から148pxに置いて、札の下と「押している間 進む」（上端は下から144px）の間に収める（直す係 第2回・2-11） */
  @media (max-height:500px) { body:not(.sm) #rot { bottom:148px; gap:6px; } body:not(.sm) #rot button { height:42px; } }
  /* 高さの低い画面（横向き）では、出典（下から約28px、2行）が左下のお祓いの数の帯と右下の大きさの3つに隠れた。帯と大きさを出典の上へ上げる（直す係 第2回・2-13） */
  @media (max-height:500px) { body:not(.sm) #best, body:not(.sm) #diffSel { bottom:32px; } }
  /* 高さの低い画面（横向き）の選ぶ画面：「建物を選んで！」の帯と「この建物を担ぐ」の札は、上の端（左の題と右上のボタンの間）に出す。
     上から96〜104pxでは、地図のまん中の浅草寺とゴールの札をふさいだ（直す係 第3回・3-8） */
  @media (max-height:500px) {
    body:not(.sm) #pickHint { top:8px; font-size:16px; padding:5px 18px; border-radius:18px; }
    body:not(.sm) #pickHint small { font-size:10px; }
    body:not(.sm) #sel { top:8px; max-width:calc(100vw - 340px); white-space:normal; padding:6px 10px; }
    body:not(.sm) #sel #carry { white-space:nowrap; flex:0 0 auto; }
  }
  #zoom button { width:42px; height:42px; padding:0; font-size:20px; font-weight:700; }
  #recenter { display:none; color:var(--red); }
  body.unfollow[data-mode=carry] #recenter { display:block; }
  #sel { position:fixed; top:96px; left:50%; transform:translateX(-50%); background:rgba(244,239,230,.95); border-radius:10px; padding:8px 12px; font-size:13px; line-height:1.55; display:none; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.25); white-space:nowrap; }
  #sel b { font-size:15px; }
  @media (max-width:600px) { #sel { top:auto; bottom:150px; left:12px; right:12px; transform:none; white-space:normal; font-size:12px; gap:8px; } #carry { flex:0 0 auto; padding:10px; font-size:14px; } }
  #sel .no { color:var(--dim); }
  /* 言葉や数字の組（「担ぎ手 1,338人」「お祓いを受けました」など）の途中で折り返さない。スマホで「担ぎ／手」「お／祓い」と折れた（直す係 第2回・2-6） */
  .nw { white-space:nowrap; }
  /* 建物に入っている店（data/shops.js。OpenStreetMap） */
  #sel .shops { display:block; white-space:normal; max-width:460px; font-size:12px; line-height:1.5; margin-top:3px; }
  #sel .shops .more, #info .shops .more { color:var(--dim); white-space:nowrap; }
  #sel .shops .s1 { white-space:nowrap; }
  #sel .shops.one { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:min(460px, calc(100vw - 180px)); }   /* 札の店は1行だけ */
  @media (max-width:600px) { #sel .shops.one { max-width:calc(100vw - 150px); } }
  #info .shops { font-size:11px; line-height:1.5; }
  #carry { background:var(--red); color:#fff; font-weight:700; }
  #view.picking { cursor:grab; }
  #view.picking.over { cursor:pointer; }
  /* 大きさ（実物大・半分・神輿）：つかえたときだけ出す。説明の文は付けない（本人「ゲームは雰囲気で説明できるように」）。id は前の難しさのまま
     10/29 本人「とにかく最初は原寸大の建物を運び出して。それで動かなかったらサイズ変更できるように。最初に右下のボタンいらない」→ 町の画面では出さない */
  #diffSel { position:fixed; right:12px; bottom:14px; display:none; background:rgba(244,239,230,.82); border-radius:9px; padding:3px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #diffSel button { background:none; box-shadow:none; font-size:12px; padding:4px 10px; border-radius:7px; color:var(--dim); }
  #diffSel button.on { background:var(--paper); color:var(--red); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.22); }
  body.sm #diffSel { right:10px; bottom:30px; flex-direction:column; }   /* スマホは縦に積む（左下のお祓いの数の帯と横に並ぶと重なるため） */
  body.sm #diffSel button { font-size:11px; padding:5px 9px; }
  /* つかえたとき：大きくなった「建物を選び直す」のすぐ下に、大きさの3つのボタンを大きめに出す */
  body.stuck[data-mode=carry] #diffSel { display:flex; flex-direction:row; left:50%; right:auto; bottom:auto; top:240px; transform:translateX(-50%); z-index:30; background:rgba(244,239,230,.94); }
  body.stuck[data-mode=carry] #diffSel button { font-size:15px; padding:8px 16px; color:var(--ink); }
  body.stuck[data-mode=carry] #diffSel button.on { color:var(--red); }
  body.sm.stuck[data-mode=carry] #diffSel { top:318px; }
  @media (max-width:600px) { body.stuck[data-mode=carry] #diffSel { top:254px; } body.sm.stuck[data-mode=carry] #diffSel { top:318px; } }
  /* 真ん中に出すときは、中身の幅で（left:50% のままだと幅が画面の半分に縮み、スマホで「簡／単」と折れた） */
  body.stuck[data-mode=carry] #diffSel { width:max-content; }
  #diffSel button { white-space:nowrap; }
  /* 最初の画面の3つのボタンも、少し見つけやすく */
  #diffSel { background:rgba(244,239,230,.94) !important; }
  #diffSel button { color:var(--ink) !important; font-size:13px; }
  #diffSel button.on { color:var(--red) !important; }
  /* 担いでいる途中で、今より大きくするとまわりにめり込む大きさは、薄くして押せない印にする（押すと首を振るだけ。文字は出さない） */
  #diffSel button.no { opacity:.38; }
  #diffSel.nope { animation:szNo .4s; }
  @keyframes szNo { 0%,100% { translate:0 0; } 25% { translate:-6px 0; } 75% { translate:6px 0; } }
  #mini { left:12px; bottom:64px; width:170px; height:170px; border:3px solid var(--paper); border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.35); background:#a9b39f; display:none; pointer-events:none; }
  body[data-mode=carry] #mini { display:block; }
  @media (max-width:600px) { #mini { width:112px; height:112px; } }
  #gateBox { left:194px; bottom:64px; width:240px; height:160px; border:3px solid var(--paper); border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.35); display:none; pointer-events:none; }
  #gateBox span { position:absolute; left:6px; top:4px; font-size:11px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.8); }
  @media (max-width:600px) { #gateBox { left:132px; width:130px; height:96px; } }
  /* 運び出しの間（2.6秒）は、建物が浮いて担ぎ手が集まる所だけを見せる。操作のボタン・情報・地図はまだ出さない */
  body.intro #dialWrap, body.intro #rot, body.intro #again, body.intro #info, body.intro #mini, body.intro #zoom, body.intro #gateBox, body.intro #guide { display:none !important; }
  /* 担ぎ始め：向き・バックは少し遅れて、選び直す・地図は最初に押してから（押さなければ数秒後）出す */
  body.calm1 #rot, body.calm1 #back { display:none !important; }
  body.calm2 #again, body.calm2 #mini { display:none !important; }
  /* 「ゴールの浅草神社に向かおう！」が出ている間は、上の札を隠し、縮んで札に吸い込まれてから出す */
  body.goWait #goalNav { visibility:hidden; }
  /* 左上は題だけ。操作の文は出さない（ボタンと「？遊び方」にある）。出典は下の端へ小さく */
  body[data-mode] #howto, body[data-mode] #title br { display:none; }
  body[data-mode]:not(.sm) #src { position:fixed; left:50%; bottom:1px; transform:translateX(-50%); width:max-content; max-width:62vw; font-size:10px; line-height:1.3; text-align:center; background:rgba(244,239,230,.7); border-radius:4px; padding:0 6px; pointer-events:none; }
  #info { cursor:pointer; }
  #skip { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); display:none; font-size:13px; padding:8px 14px; background:rgba(244,239,230,.9); }
  #done { position:fixed; left:50%; top:86px; transform:translateX(-50%); background:rgba(244,239,230,.96); border:3px solid var(--gold); border-radius:14px; padding:10px 20px; text-align:center; display:none; opacity:0; transition:opacity .5s; box-shadow:0 4px 18px rgba(0,0,0,.3); min-width:240px; pointer-events:none; }
  #done.on { opacity:1; }
  #done .big { font-size:30px; font-weight:800; color:var(--red); letter-spacing:.25em; margin-bottom:4px; }
  #doneInfo { font-size:14px; line-height:1.75; }
  #best { left:12px; bottom:14px; background:rgba(244,239,230,.9); border-radius:8px; padding:5px 9px; font-size:12px; line-height:1.5; display:none; max-width:70vw; }
  /* お祓いを受けた建物の数は、町の画面でいつも出す（0棟でも）。いちばん大きい建物は、受けたことがあるときだけ */
  body[data-mode=pick] #best { display:block; }
  #bestBig { display:none; margin-top:3px; padding-top:3px; border-top:1px solid rgba(43,36,32,.18); }
  #best.has #bestBig { display:block; }
  #bestCnt b { font-size:13px; }
  body.sm #best { font-size:11px; padding:4px 8px; line-height:1.45; }
  body.sm #bestCnt b { font-size:12px; }
  /* 触れた建物の難しさ（data/difficulty.js。無ければ出さない） */
  #sel .diff { color:var(--ink); }
  #sel .diff .st { color:var(--gold); letter-spacing:.06em; font-size:14px; }
  #sel .diff.d4 .st, #sel .diff.d5 .st { color:var(--red); }
  /* スマホのお祓い・魂振りの札は、左上の地図の下に出す。前は下から170pxで、神輿（画面の下から約330〜380px）と揺れる担ぎ手を覆った（直す係 第1回・不具合13） */
  @media (max-width:600px) { #done { top:156px; bottom:auto; font-size:12px; } #done .big { font-size:24px; } }
  #mute, #photoBtn { font-size:12px; padding:5px 10px; }
  #photoBtn.off { color:var(--dim); }
  #photoBtn { display:none !important; }   /* 本人「写真ありいらない」：写真はいつも出すので、切り替えは見せない */
  /* 町の写真を読み込んでいる間だけ、右上に小さく出す */
  #ttLoad { display:none; background:rgba(244,239,230,.85); border-radius:6px; padding:2px 8px; font-size:11px; color:var(--dim); pointer-events:none; }
  #ttLoad.on { display:block; }
  #right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; max-width:44vw; }
  #guide { display:none; background:rgba(244,239,230,.94); border-radius:8px; padding:5px 9px; font-size:12px; line-height:1.6; max-width:340px; }
  #guide button { background:none; box-shadow:none; padding:0; font-size:12px; font-weight:700; color:var(--red); }
  #guide.closed #guideText { display:none; }
  #guideText { margin-top:3px; }
  #sel .lm { white-space:normal; max-width:520px; font-size:12px; line-height:1.6; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid rgba(43,36,32,.2); }
  #tour { position:fixed; left:50%; top:96px; transform:translate(-50%, 8px); width:min(560px, 86vw); background:rgba(244,239,230,.96); border-left:5px solid var(--red); border-radius:8px; padding:9px 14px; font-size:14px; line-height:1.7; box-shadow:0 2px 10px rgba(0,0,0,.25); opacity:0; transition:opacity .8s, transform .8s; pointer-events:none; }
  #tour.on { opacity:1; transform:translate(-50%, 0); }
  /* 横の中寄せは translate で（transform の動きに入れない）。前は細い札から幅を戻した直後、transform の動きの途中で中寄せが細い幅のまま残り、
     札が右へずれて「押している間 進む」の下にもぐった（直す係 第2回・2-5） */
  #tour { translate:-50% 0; transform:translateY(8px); }
  #tour.on { transform:none; }
  #tour b { font-size:15px; }
  #tour .tarr { display:inline-block; color:var(--red); font-size:17px; line-height:1; margin-right:6px; }
  /* 動いている間は名前と矢印だけ。止まったら（.read）文がふわっと出て、動き出したら静かに消える */
  #tour.slim { width:fit-content; }   /* 文が消えきってから細くする（隠した文の幅まで測られないように、.slim では文を外す） */
  #tour.slim .tt { display:none; }
  #tour .tt { display:block; max-height:0; opacity:0; overflow:hidden; transition:max-height .6s, opacity .6s; }
  #tour.read .tt { max-height:16em; opacity:1; }
  /* 説明を消す×（札は押せないので、×だけ押せるようにする。出ている間だけ） */
  #tour { padding-right:34px; }
  #tour .tx { position:absolute; top:3px; right:4px; width:28px; height:28px; padding:0; background:none; box-shadow:none; font-size:18px; line-height:28px; color:var(--dim); }
  #tour.on .tx { pointer-events:auto; }
  #tour .tx::after { content:''; position:absolute; inset:-8px; }
  @media (max-width:600px) { #tour { top:auto; bottom:240px; font-size:12px; } #guide { max-width:52vw; font-size:11px; } }
  #hold, #back { position:fixed; border-radius:50%; font-weight:700; touch-action:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; box-shadow:0 3px 10px rgba(0,0,0,.35); }
  #hold { right:24px; bottom:24px; width:120px; height:120px; padding:8px; background:var(--red); color:#fff; font-size:16px; line-height:1.35; }
  #back { right:158px; bottom:34px; width:70px; height:70px; padding:0; font-size:15px; }
  #hold.on { background:#8f2019; }
  /* 10/26 本人「向きとバックと進むがそれぞれ別々のボタンだから見にくい。一つでできない？ジョイスティックみたいな感じで」：
     右下の丸ひとつ（#stick）にまとめた。上へ倒すと進む・下へ倒すとバック・左右へ倒すと向きを変える（斜めなら進みながら曲がる）。前のボタンは隠すだけ（キーの操作と中の仕組みはそのまま） */
  #hold, #back, #rot { display:none !important; }
  #stick { position:fixed; right:24px; bottom:24px; width:140px; height:140px; border-radius:50%; background:rgba(244,239,230,.82); box-shadow:0 3px 10px rgba(0,0,0,.35); touch-action:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; cursor:grab; }
  #stick .lb { position:absolute; font-size:11px; font-weight:700; color:var(--dim); line-height:1; pointer-events:none; white-space:nowrap; }
  #stick .up { top:9px; left:50%; transform:translateX(-50%); color:var(--red); }
  #stick .dn { bottom:9px; left:50%; transform:translateX(-50%); }
  #stick .lf { left:8px; top:50%; transform:translateY(-50%); font-size:16px; }
  #stick .rt { right:8px; top:50%; transform:translateY(-50%); font-size:16px; }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:var(--red); box-shadow:0 2px 6px rgba(0,0,0,.4); pointer-events:none; transition:transform .12s; }
  #stick.on #knob { transition:none; background:#8f2019; }
  #stick.glow { animation:glow 1s ease-in-out infinite; }
  body.calm1 #stick .dn, body.calm1 #stick .lf, body.calm1 #stick .rt { visibility:hidden; }   /* 運び出しの直後は「進む」だけ */
  body.sm #stick { right:14px; bottom:40px; width:118px; height:118px; }
  body.sm #knob { width:48px; height:48px; margin:-24px 0 0 -24px; }
  /* 小さな地図：スマホは出さない（本人「いらない」）。PC（マウスの画面）だけ左上に丸く出す。神輿の進む向きがいつも上（カメラと同じ向き） */
  #mini { display:none !important; top:12px; bottom:auto; left:12px; width:180px; height:180px; border-radius:50%; }
  @media (pointer:fine) { html body[data-mode=carry]:not(.sm):not(.intro):not(.hanabi):not(.calm2) #mini { display:block !important; } }
  /* PC（マウスの画面）は、ジョイスティックの代わりにキーボードと同じ並びの十字のキー（↑進む・←→向き・↓バック）。キーを押すと光る。マウスで押しても動く */
  #keys { position:fixed; right:24px; bottom:24px; display:none; grid-template-columns:repeat(3, 62px); grid-template-rows:repeat(2, 62px); gap:6px; }
  #keys .k { border-radius:12px; background:rgba(244,239,230,.92); box-shadow:0 2px 0 rgba(0,0,0,.25), 0 3px 10px rgba(0,0,0,.3); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-weight:700; color:var(--ink); cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; padding:0; }
  #keys .k b { font-size:22px; line-height:1; }
  #keys .k small { font-size:10px; color:var(--dim); line-height:1; }
  #keys .k.on { background:#e8dcc6; transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.3); }

  #keys.glow .k, #keys .k.glow { animation:glow 1s ease-in-out infinite; }
  body.calm1 #keys #kL, body.calm1 #keys #kD, body.calm1 #keys #kR { visibility:hidden; }
  @media (pointer:fine) { #stick { display:none !important; } #keys { display:grid; } #help .spOnly { display:none; } }
  @media not all and (pointer:fine) { #help .pcOnly { display:none; } }
  /* スマホを横に持ったとき（指で触る画面で横長）：両手持ちのゲームと同じく、ジョイスティックは左の親指で。「建物を選び直す」は右下へ。
     縦持ち（片手。右の親指が多い）とPCは右のまま */
  @media (pointer:coarse) and (orientation:landscape) {
    html body #stick { right:auto; left:16px; }

  }
  #back.on { background:#d8cfc0; }

  @media (max-width:600px) { #tour { bottom:250px; } }
  /* 雷門の提灯の小窓（左下、右端は452px）が出ている間（body.gateOn）は、名所の説明の札を小窓の右へよける。
     1280px幅で札の左端が小窓に重なり、提灯の絵が隠れた（直す係 第1回・不具合3）。右の「向き」ボタン（右から196px）にもかからない幅にする */
  @media (min-width:1000px) {
    body.gateOn:not(.sm) #tour { left:max(50%, calc(452px + min(280px, 50vw - 330px))); }
    body.gateOn:not(.sm) #tour:not(.slim) { width:min(560px, calc(100vw - 660px)); box-sizing:border-box; }
  }
  /* 「やり直す」（町に戻って建物を選び直す）。10/29 本人「選び直すボタンも薄くしてでかくてもいい。やり直す感じの文言じゃないとわかりづらいかも」
     → 字を大きく、地を薄く（向こうの町が透ける） */
  #again { position:fixed; left:12px; bottom:14px; display:none; font-size:16px; font-weight:700; padding:10px 18px; background:rgba(244,239,230,.62); color:var(--ink); }
  /* 幅や高さでつかえたときは、やり直すボタンを大きく、つかえた札のすぐ下に出す */
  #again.big { left:50%; bottom:auto; top:178px; transform:translateX(-50%); font-size:20px; font-weight:700; padding:12px 30px; background:rgba(194,38,30,.78); color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  @media (max-width:600px) { #again.big { top:196px; font-size:16px; padding:11px 20px; } }
  @media (max-width:600px) {
    #title { max-width:58vw; font-size:12px; }
    #info { font-size:11px; max-width:42vw; padding:5px 8px; }
    #msg { font-size:16px; white-space:normal; width:80vw; }
  }
  /* ---- 遊び方の札・ゴールまでの距離と矢印・次に押すものの合図 ---- */
  #btnrow { display:flex; gap:6px; }
  #helpBtn { font-size:12px; padding:5px 10px; }
  #help { position:fixed; inset:0; background:rgba(20,16,14,.38); display:none; align-items:center; justify-content:center; z-index:80; }
  #help.on { display:flex; }
  #help .hb { background:var(--paper); border-radius:16px; padding:22px 28px 20px; max-width:min(600px, 88vw); box-shadow:0 6px 24px rgba(0,0,0,.35); text-align:left; }
  #help .ht { font-size:24px; font-weight:800; color:var(--red); margin-bottom:8px; }
  #help p { font-size:21px; line-height:1.6; margin:8px 0; }
  #helpGo { display:block; margin:16px auto 0; background:var(--red); color:#fff; font-size:20px; font-weight:700; padding:12px 40px; }
  #goalNav { position:fixed; left:50%; top:12px; transform:translateX(-50%); background:rgba(244,239,230,.94); border:2px solid var(--red); border-radius:22px; padding:6px 16px 6px 10px; font-size:16px; font-weight:700; display:none; align-items:center; gap:8px; box-shadow:0 1px 4px rgba(0,0,0,.25); pointer-events:none; white-space:nowrap; }
  #goalNav.on { display:flex; }
  #goalArrow { display:inline-block; color:var(--red); font-size:22px; line-height:1; }
  @keyframes glow { 0%,100% { box-shadow:0 0 0 0 rgba(200,50,42,.75); } 50% { box-shadow:0 0 0 14px rgba(200,50,42,0); } }
  #hold.glow, #back.glow, #rot button.glow { animation:glow 1s ease-in-out infinite; }
  body.sm #help p { font-size:17px; }
  body.sm #help .ht { font-size:20px; }
  body.sm #goalNav { top:152px; left:116px; right:12px; transform:none; font-size:14px; justify-content:center; padding:5px 10px; }
  body.sm #helpBtn { font-size:11px; padding:4px 8px; }
  /* 担ぎ始めに一度、「浅草神社まで あと○m」を少し大きくして目立たせる（3秒ほど） */
  @keyframes navPop { 0%,100% { scale:1; } 12%,48%,84% { scale:1.3; background:#fff3d2; box-shadow:0 0 0 6px rgba(217,165,33,.6), 0 1px 4px rgba(0,0,0,.25); } 30%,66% { scale:1.18; background:#fff3d2; box-shadow:0 0 0 3px rgba(217,165,33,.45), 0 1px 4px rgba(0,0,0,.25); } }
  #goalNav.pop { animation:navPop 3.2s ease-in-out; transform-origin:50% 0; }
  /* 町の画面の一行の案内（一度担いだら出さない）。PCは「この建物を担ぐ」の札と同じ所、札が出ている間は隠す */
  #pickHint { position:fixed; top:96px; left:50%; transform:translateX(-50%); background:rgba(43,36,32,.78); color:#fff; padding:6px 14px; border-radius:16px; font-size:14px; white-space:nowrap; display:none; pointer-events:none; }
  #pickHint.on { display:block; }
  /* スマホは2行まで：文の切れ目（「担げます。」の後）で折る（「色の意味」ボタンを無くしたので左端から） */
  #pickHint span { display:inline-block; }
  #pickHint { top:104px; background:rgba(200,50,42,.92); padding:10px 26px; border-radius:24px; font-size:22px; box-shadow:0 2px 12px rgba(0,0,0,.4); animation:pickPulse 1.8s ease-in-out infinite; text-align:center; }
  #pickHint b { display:block; letter-spacing:.06em; }
  #pickHint small { display:block; font-size:12px; font-weight:400; opacity:.92; }
  @keyframes pickPulse { 0%,100% { scale:1; } 50% { scale:1.06; } }
  #goGoal { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); background:rgba(200,50,42,.94); color:#fff; font-size:26px; font-weight:800; letter-spacing:.06em; padding:14px 30px; border-radius:28px; box-shadow:0 3px 16px rgba(0,0,0,.45); white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .5s; z-index:40; }
  #goGoal.on { opacity:1; }
  body.sm #goGoal { font-size:19px; padding:11px 20px; }
  body.sm #pickHint { top:56px; left:50%; right:auto; transform:translateX(-50%); text-align:center; font-size:18px; line-height:1.4; padding:8px 22px; white-space:nowrap; }
  /* ---- スマホ（幅600px未満か縦長）：出すものを減らし、親指で押せる大きさと位置にする ---- */
  body.sm #title { max-width:58vw; font-size:13px; padding:5px 10px; }
  body.sm #title br, body.sm #howto { display:none; }
  body.sm #src { position:fixed; left:0; right:0; bottom:2px; text-align:center; font-size:9px; color:rgba(43,36,32,.75); text-shadow:0 0 3px #fff; pointer-events:none; }
  #src .sm2 { display:none; }
  body.sm #src { line-height:1.2; }
  body.sm #src .gsi { display:block; }
  body.sm #src .sl { display:none; }
  body.sm #src .sm2 { display:inline; }
  /* スマホ：出典（OpenStreetMap を足して2行）が夜の町やお祓いの数の帯に隠れないよう、薄い下地を付け、帯をその上に上げる */
  body.sm #src { background:rgba(244,239,230,.72); padding:1px 0 2px; bottom:0; }
  body.sm #best { bottom:30px; }
  /* 390px幅では出典が3行（高さ約36px）に折れるので、その上に出すもの（帯・大きさ・向き・バック・進む・選び直す）を出典の上まで上げる。
     前は2行のつもりで、1行目の上半分が帯とボタンに隠れた（直す係 第1回・不具合10・12） */
  body.sm #best, body.sm #diffSel { bottom:40px; }
  @media (max-width:600px) { #sel { bottom:160px; } }
  body.sm #right { max-width:62vw; }
  body.sm #mute, body.sm #photoBtn { font-size:11px; padding:4px 8px; }
  body.sm #ttLoad { font-size:10px; }
  body.sm #info { font-size:12px; max-width:62vw; cursor:pointer; padding:5px 9px; }
  body.sm #guide { max-width:62vw; font-size:11px; }
  body.sm #mini { top:48px; bottom:auto; left:10px; width:96px; height:96px; }
  body.sm #gateBox { top:150px; bottom:auto; left:10px; width:96px; height:76px; }
  body.sm #msg { top:192px; font-size:15px; width:84vw; white-space:normal; }
  body.sm #again.big { top:262px; bottom:auto; font-size:16px; padding:11px 22px; }   /* body.sm #again の小さい字に負けないように、ここでも大きさを書く */
  /* 名所の説明の札は、神輿（画面の下から約330〜380px）より下、「建物を選び直す」のすぐ上に出す。
     前は下から232pxで、神輿の下半分と担ぎ手を覆った（直す係 第1回・不具合11） */
  body.sm #tour { bottom:154px !important; font-size:11px; line-height:1.55; width:calc(100vw - 24px); padding:7px 10px; }
  body.sm #tour.slim { width:fit-content; }
  /* 名所の説明の札：いつもの場所（下）で神輿と担ぎ手を覆うときは、上の場所（.up）へ移す（tourPlace。直す係 第2回・2-5・2-14）。
     スマホ縦は左上の地図・雷門の小窓・「浅草神社まで」の札の下。横向きは「浅草神社まで」の札の下で、左の題と右上の担ぎ手の札の間 */
  body.sm #tour.up { top:232px !important; bottom:auto !important; }
  @media (max-height:500px) { body:not(.sm) #tour.up { top:54px !important; bottom:auto !important; left:calc(50% - 52px); font-size:12px; line-height:1.6; } }
  /* 上へ移した札は、つかえたときの札とボタン（上のまん中）に重なるので、その間は隠す */
  body.stuck #tour.up { visibility:hidden; }
  /* 進む・バック・向き・選び直すは、3行の出典（高さ約36px）の上に出す（直す係 第1回・不具合12。前は下から22〜28pxで出典の1行目を覆った） */
  body.sm #hold { right:14px; bottom:40px; width:100px; height:100px; padding:4px; font-size:13px; line-height:1.4; }
  body.sm #back { right:124px; bottom:46px; width:62px; height:62px; font-size:14px; }
  /* 向きの二つは左の親指、進む・バックは右の親指（同時に押して、進みながら曲がれる） */
  body.sm #rot { left:12px; right:auto; bottom:40px; gap:10px; }
  body.sm #rot button { width:74px; height:62px; font-size:15px; font-weight:700; }
  body.sm #again { font-size:14px; padding:8px 14px; bottom:116px; }
  body.sm #skip { bottom:140px; }   /* 左下のお祓いの記録の札と重ならない高さ */
  body.sm #zoom button { width:38px; height:38px; font-size:18px; }
  /* スマホ：小さいボタンは、見た目はそのままで、指で押せる範囲（::after）だけを広げて高さ44px前後にする。
     10/19 スマホの条件（390×844）で測ったら、上の段が高さ24px、寄る引くが38px、選び直すが31pxだった。隣のボタンとの間を越えないように広げる */
  body.sm #btnrow button, body.sm #zoom button, body.sm #carry { position:relative; }
  body.sm #btnrow button::after, body.sm #zoom button::after, body.sm #again:not(.big)::after, body.sm #carry::after { content:''; position:absolute; }
  body.sm #btnrow button::after { inset:-10px -3px; }
  /* 上の段のいちばん右（「昼にする」を無くしたので音のボタン）は、右の画面の端まで広げる */
  body.sm #btnrow #mute::after { inset:-10px -12px -10px -3px; }
  body.sm #zoom button::after { inset:-4px -3px; }
  body.sm #again:not(.big)::after { inset:-7px -2px; }
  body.sm #carry::after { inset:-2px; }
  /* 選ぶ画面の大きさ3つ（縦に隙間なく積んである）は、ボタン自体を26→36pxに高くする（上の「この建物を担ぐ」の札にかからない高さまで） */
  body.sm[data-mode=pick] #diffSel button { padding-top:10px; padding-bottom:10px; }
  /* つかえたときの大きさ3つ（横に隙間なく並ぶ、高さ37px）は、上下にだけ押せる範囲を広げる */
  body.sm.stuck[data-mode=carry] #diffSel button { position:relative; }
  body.sm.stuck[data-mode=carry] #diffSel button::after { content:''; position:absolute; inset:-4px 0; }
  /* 町が出るまでの読み込み中の印（文字は出さない）。速い4G・CPU4倍のスマホの条件で、町が出るまで約19秒、何も出ない画面が続いていた（10/19） */
  #boot { position:fixed; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border:4px solid rgba(43,36,32,.16); border-top-color:var(--red); border-radius:50%; animation:bootSpin .9s linear infinite; pointer-events:none; z-index:5; }
  @keyframes bootSpin { to { transform:rotate(360deg); } }
  /* ---- 題字の画面（本人の決定 10/23）：開いたらまず「ビル神輿」と「触ってはじめる」だけ。触ると空から町へ降りてくる。?skipTitle=1 で出さない ----
     町の読み込みの間は夜空の色の上に題字だけ。読み終えたら夜空の色を消し、後ろでゲームの画面そのままのカメラの画をくり返す（index.html の「題字の画面」の節）。
     字の色と影は応募動画の冒頭の「東京・浅草」と同じ（白から薄い金）。出典（#src）は題字の画面の上に出したままにする */
  #ttl { position:fixed; inset:0; z-index:95; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  #ttlSky { position:absolute; inset:0; background:linear-gradient(180deg, #050a1c 0%, #0b1433 55%, #1b2950 100%); transition:opacity 1.4s; }
  #ttl.ready #ttlSky { opacity:0; }
  /* 字のまわりと上下の端だけ、夜空の色で少し沈める（後ろの町の画の上でも字が読めるように） */
  #ttlShade { position:absolute; inset:0; background:radial-gradient(ellipse 74% 40% at 50% 43%, rgba(4,8,22,.52) 0%, rgba(4,8,22,.26) 55%, rgba(4,8,22,0) 100%), linear-gradient(180deg, rgba(4,8,22,.32) 0%, rgba(4,8,22,0) 26%, rgba(4,8,22,0) 78%, rgba(4,8,22,.38) 100%); transition:opacity .7s; }
  /* 画の切り替え（短く暗くして替える）と、触ったあとの暗転に使う幕。濃さは毎こま決める */
  #ttlVeil { position:absolute; inset:0; background:#03060f; opacity:0; pointer-events:none; }
  #ttlName, #ttlTap { position:relative; font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-weight:800; white-space:nowrap; line-height:1; }
  /* 題字：極太の古い明朝を生成りの白で。右下に朱の判「浅草」（本人が見本から選んだ W3） */
  #ttlName { margin-top:-14vh; font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-weight:900; font-size:min(19vw, 17vh, 168px); letter-spacing:.12em; padding-left:.12em;
    color:#f7f1e3; text-shadow:0 2px 4px rgba(0,0,0,.8), 0 0 20px rgba(0,0,0,.55); opacity:0; transition:opacity 1.4s; }
  #ttlSeal { position:absolute; right:-.42em; bottom:-.1em; writing-mode:vertical-rl; font-family:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:400; font-size:.2em; line-height:1; letter-spacing:.05em;
    padding:.18em .1em; background:#c8321f; color:#fbefe0; border-radius:.08em; text-shadow:none; box-shadow:0 1px 3px rgba(0,0,0,.6); }
  #ttl.font #ttlName { opacity:1; }
  #ttlTap { margin-top:min(6vh, 52px); font-size:min(4.6vw, 2.6vh, 21px); letter-spacing:.42em; padding-left:.42em; color:#f3e7c8; text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.8), 0 0 22px rgba(0,0,0,.6); opacity:0; }
  #ttl.ready.font #ttlTap { animation:ttlTap 2.8s ease-in-out infinite; }
  /* いちばん薄い時でも読めるように（10/23 上空の明るい町の画の上で、薄い時に読めなかった） */
  @keyframes ttlTap { 0%, 100% { opacity:.68; } 50% { opacity:1; } }
  #ttl.go #ttlName, #ttl.go #ttlTap { opacity:0 !important; animation:none; transition:opacity .35s; }
  #ttl.out { pointer-events:none; }
  #ttl.out #ttlSky, #ttl.out #ttlShade { opacity:0; }
  #ttl.out #ttlVeil { animation:ttlOut .7s ease-out forwards; }
  @keyframes ttlOut { from { opacity:1; } to { opacity:0; } }
  /* 題字の画面の間は、町の画面のボタン・札を出さない（出典だけは残す。左上の題の箱は、字と下地を消して出典の置き場にだけ使う） */
  /* 花火の間は、空と浅草神社を見せるため、小さな地図とズームのボタンを隠す */
  body.hanabi #mini, body.hanabi #zoom { display:none !important; }
  body.titling #boot, body.titling #right, body.titling #diffSel, body.titling #best, body.titling #pickHint, body.titling #zoom, body.titling #sel, body.titling #skip, body.titling #help, body.titling #goGoal { display:none !important; }
  /* 出典の入った上の段は、題字の画面（#ttl）がある間はその上に出す（触ったあとの暗転の間も出典が消えないように） */
  #ttl ~ #top { z-index:96; }
  body.titling #top, body.titling #top * { pointer-events:none !important; }
  body.titling #title { background:none; box-shadow:none; }
  /* 10/26 本人「画面の情報は少ないほうがよい」：左上の「ビル神輿」と、下のお祓いの記録（○棟・いちばん大きい建物）は出さない。
     出典は地図の決まり（PLATEAU・地理院・OpenStreetMap）で消せないので、題字の画面では全部を出し、遊んでいる間は左下の小さな「出典」だけにする（押すと開く。遊び方にも全文） */
  body[data-mode] #title { background:none; box-shadow:none; padding:0; }
  body[data-mode] #title > b { display:none; }
  #best { display:none !important; }
  body[data-mode]:not(.titling):not(.srcOpen) #src { display:none !important; }
  body.srcOpen #src { pointer-events:auto !important; cursor:pointer; z-index:60; }
  #srcBtn { position:fixed; left:50%; transform:translateX(-50%); bottom:3px; z-index:20; font-size:11px; padding:3px 8px; background:rgba(244,239,230,.85); color:var(--dim); display:none; }
  body[data-mode]:not(.titling):not(.hanabi):not(.srcOpen) #srcBtn { display:block; }
  body.sm #srcBtn { bottom:3px; }
  #help .src { font-size:11px; color:var(--dim); line-height:1.5; margin-top:10px; }
  body.titling #title > b, body.titling #title > br, body.titling #howto { display:none; }

<body>
<script>/* スマホの形（body.sm）を、重いデータを読む前に当てる（前は町が出るまで、PCの形のボタンが縦に折れて出ていた） */ if (innerWidth < 600 || innerHeight > innerWidth) document.body.classList.add('sm');</script>
<div id="boot"></div>
<div id="ttl"><div id="ttlSky"></div><div id="ttlShade"></div><div id="ttlName">ビル神輿<span id="ttlSeal">浅草</span></div><div id="ttlTap">はじめる</div><div id="ttlVeil"></div></div>
<script>
/* 題字の画面の受け付け（町のデータを読む前から動かす）。触ったら、町が出ていれば go（start の中で入れる）、まだなら出たらすぐ始める（want）。
   字は書体が届いてから出す（届く前に別の書体で出て、あとで形が替わらないように）。3秒待っても届かなければ明朝で出す */
(function () {
  const el = document.getElementById('ttl'), T = window.__title = { on: false, want: false, go: null };
  if (new URLSearchParams(location.search).get('skipTitle') === '1') { el.remove(); return; }

  // 名所の前を通る（約40m以内）と、車夫の案内のように説明が一度だけふわっと出て消える
