<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>浸水体験（試作）</title>
<style>
:root{
  --panel: rgba(24, 36, 48, .74);
  --panel-strong: rgba(24, 36, 48, .9);
  --text: #f3f6f8;
  --sub: #b4c3cf;
  --water: #8fd0ee;
  --accent: #3f8fcf;
}
html,body{
  margin:0;height:100%;overflow:hidden;background:#c6d1d9;color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}

/* ---------- 地図 ---------- */
#mapLabels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.mlab{
  position:absolute;left:0;top:0;font-size:12px;line-height:1.3;color:#24323e;white-space:nowrap;
  background:rgba(255,255,255,.82);padding:1px 6px;border-radius:6px;
}
.mlab.city{font-size:14px;font-weight:700;background:none;color:#3b4a56;text-shadow:0 0 3px #fff,0 0 3px #fff}
.mlab.river{font-size:18px;font-weight:700;background:none;color:#1b5f9e;letter-spacing:.2em;text-shadow:0 0 3px #fff,0 0 4px #fff}
.mlab.breach{background:#c8323b;color:#fff;font-weight:700;font-size:13px;padding:3px 8px}
/* 駅：線路の上の駅の位置に丸い印を置き、駅名はその真上に出す */
.mlab.sta{margin-top:-11px;font-weight:700}
.mlab.sta::after{
  content:"";position:absolute;left:50%;top:100%;width:8px;height:8px;margin:5px 0 0 -6px;
  background:#fff;border:2px solid #24323e;border-radius:50%;
}
#pickInfo .far{font-size:13px;color:var(--water);margin-top:2px}
#legend{
  position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 84px);width:172px;box-sizing:border-box;
  background:rgba(255,255,255,.9);color:#24323e;border-radius:10px;padding:7px 9px 6px;pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
#legend .lt{font-size:11.5px;font-weight:700;margin-bottom:3px}
#legend .lg{font-size:11.5px;display:flex;align-items:center;gap:6px;line-height:1.55}
#legend .lg i{display:inline-block;width:16px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.18)}
#legend .ls{font-size:9px;line-height:1.35;color:#5a6873;margin-top:3px}
#toast{
  position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--panel-strong);
  border-radius:10px;padding:10px 16px;font-size:15px;pointer-events:none;
}
#floorAsk{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--cred, calc(env(safe-area-inset-bottom) + 22px)) + 12px);
  width:min(92vw,380px);box-sizing:border-box;background:var(--panel-strong);border-radius:14px;padding:14px 16px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center;
}
#floorAsk .q{font-size:16px;font-weight:700}
#floorAsk .row2{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
#floorAsk .row2 button{width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:28px;line-height:1}
#floorAsk .row2 button:disabled{opacity:.35}
#floorVal{font-size:30px;font-weight:700;min-width:96px;font-variant-numeric:tabular-nums}
#floorGo{width:100%;height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
#mapTop{
  position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 12px);width:min(330px,calc(100vw - 92px));box-sizing:border-box;
  background:var(--panel);border-radius:12px;padding:9px 12px 10px 14px;pointer-events:none;
}
#mapTop .t{font-size:17px;font-weight:700}
#mapTop .s{font-size:13px;color:var(--sub);margin-top:2px}
/* 住所で探す欄。候補は地図の上に重ねて出す */
#addr{position:relative;margin-top:8px;pointer-events:auto}
#addrIn{
  display:block;width:100%;height:40px;box-sizing:border-box;border:0;border-radius:9px;padding:0 36px 0 11px;margin:0;
  background:#fff;color:#1d2d3a;font-family:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;
  -webkit-user-select:text;user-select:text;
}
#addrIn::placeholder{color:#7d8a94}
#addrIn:focus{box-shadow:0 0 0 2px var(--accent)}
#addrClr{position:absolute;right:2px;top:2px;width:36px;height:36px;border:0;background:none;color:#7d8a94;font-size:20px;line-height:1;padding:0}
#addrList{
  position:absolute;left:0;right:0;top:44px;z-index:5;background:#fff;color:#1d2d3a;border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.22);max-height:min(46vh,330px);overflow:auto;-webkit-overflow-scrolling:touch;
}
#addrList button{
  display:block;width:100%;box-sizing:border-box;text-align:left;border:0;border-bottom:1px solid #e3e8ec;background:none;
  padding:10px 12px;margin:0;font-size:15px;line-height:1.35;color:#1d2d3a;
}
#addrList button:last-child{border-bottom:0}
#addrList button.on,#addrList button:hover{background:#eaf3fb}
#addrList button small{display:block;font-size:12px;color:#5a6873}
#addrList .msg2{padding:10px 12px;font-size:14px;line-height:1.5}
#zoom{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px);display:flex;flex-direction:column;gap:8px}
#zoom button{width:44px;height:44px;border-radius:10px;border:0;background:var(--panel);color:#fff;font-size:24px;line-height:1}
/* 方位磁針。カメラを回すと一緒に回る。押すと北を上に戻す */
#compass{
  position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 120px);width:44px;height:44px;padding:0;border:0;border-radius:50%;
  background:var(--panel);
}
#compass svg{display:block;width:44px;height:44px}
#pickInfo .adr{font-size:12px;color:var(--sub);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pick{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--cred, calc(env(safe-area-inset-bottom) + 22px)) + 12px);
  width:min(92vw,380px);box-sizing:border-box;background:var(--panel-strong);border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);
}
#pickInfo{flex:1 1 auto;font-size:15px;min-width:0}
#pickGo{flex:0 0 auto;height:46px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
#credit{
  position:fixed;left:0;right:0;bottom:0;padding:4px 8px calc(env(safe-area-inset-bottom) + 4px);
  font-size:10px;line-height:1.4;color:#33414c;background:rgba(255,255,255,.72);
}
#credit a{color:inherit}

/* ---------- 居間 ---------- */
#hud{
  position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 12px 0;pointer-events:none;
}
#hudRow{display:flex;justify-content:space-between;gap:10px}
.box{background:var(--panel);border-radius:12px;padding:7px 13px 8px;min-width:0}
.lab{font-size:12px;color:var(--sub)}
.val{font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.val small{font-size:15px;font-weight:600;margin-left:2px}
#rainSub{font-size:12px;color:var(--water);min-height:1.2em;white-space:nowrap}
#depthBox{text-align:right}
#depthBox .val{color:var(--water)}
#meter{position:relative;height:8px;margin-top:10px;border-radius:4px;background:rgba(24,36,48,.45);overflow:visible}
#meterFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--water)}
.tick{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;background:rgba(255,255,255,.55);border-radius:1px}
.tick.on{background:#fff}

#hint{
  position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);pointer-events:none;
  background:var(--panel-strong);border-radius:12px;padding:12px 18px;font-size:17px;white-space:nowrap;
  transition:opacity .5s;
}
#hint .hand{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--water);margin-right:14px;vertical-align:1px;animation:rub 1.1s ease-in-out infinite}
@keyframes rub{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}

#msgs{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
  width:min(92vw,520px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
}
.msg{
  background:var(--panel-strong);border-radius:10px;padding:9px 16px;font-size:16px;line-height:1.5;
  text-align:center;white-space:pre-line;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s;
}
.msg.show{opacity:1;transform:none}
#stop{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 26px);
  height:46px;padding:0 22px;border:0;border-radius:23px;background:rgba(255,255,255,.92);color:#1d2d3a;
  font-size:15px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:opacity .4s;
}
#note{
  position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);
  font-size:11px;color:#fff;background:rgba(24,36,48,.5);padding:2px 7px;border-radius:6px;pointer-events:none;
}
#under{
  position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .5s;
  background:radial-gradient(ellipse at 50% 30%, rgba(120,110,80,.62), rgba(70,62,42,.86));
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}

/* ---------- 結果 ---------- */
#result{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;
  background:rgba(14,22,30,.55);opacity:0;pointer-events:none;transition:opacity .6s;
}
#result.show{opacity:1;pointer-events:auto}
/* 結果のときは、後ろの数字や一言を隠す */
body.res #hud,body.res #note,body.res #msgs,body.res #stop,body.res #hint,body.res #alert{visibility:hidden}
.card{
  background:#1d2933;border-radius:16px;padding:18px 18px 12px;width:min(94vw,400px);box-sizing:border-box;
  box-shadow:0 10px 34px rgba(0,0,0,.45);max-height:calc(100vh - 24px);overflow:auto;
}
.lead{font-size:18px;font-weight:700;line-height:1.45;color:#fff}
.rain{font-size:13px;color:var(--sub);margin-top:4px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.kv:first-of-type{margin-top:8px;border-top:1px solid rgba(255,255,255,.1)}
.kv .k{font-size:14px;color:#c5d2dc;flex:1 1 auto;min-width:0}
.kv .v{font-size:30px;font-weight:700;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.kv .v small{font-size:15px;font-weight:600;margin-left:2px}
.kv .v .u{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:1px}
.note2{font-size:12px;color:var(--sub);margin-top:8px}
.warn{
  margin-top:12px;background:#2c3a47;border-left:5px solid var(--water);border-radius:8px;
  padding:10px 12px;font-size:15px;font-weight:700;line-height:1.5;color:#fff;
}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;height:46px;border:0;border-radius:10px;font-size:15px;font-weight:700}
#again{background:var(--accent);color:#fff}
#rePick{background:rgba(255,255,255,.14);color:#fff}
.src{margin-top:8px;font-size:12px;color:var(--sub)}
.src summary{cursor:pointer;padding:4px 0;list-style:none}
.src summary::-webkit-details-marker{display:none}
.src summary::before{content:"＋ "}
.src[open] summary::before{content:"− "}
.src div{font-size:10.5px;line-height:1.55;padding-top:4px}

/* 荒川の知らせ（この作品の中の目安。本物の速報の見た目にはしない） */
#alert{
  position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 124px);
  display:flex;align-items:center;gap:10px;background:#22303c;border-left:6px solid var(--water);
  border-radius:8px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s;pointer-events:none;
}
#alert.show{opacity:1;transform:none}
#alert.breach{border-left-color:#c8323b;background:#2b2328}
#alert .at{flex:1 1 auto;font-size:16px;font-weight:700;color:#fff;line-height:1.4}
#alert .tag{flex:0 0 auto;font-size:11px;color:#c5d2dc;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:1px 7px}

@media (max-width:420px){
  /* 下の欄は、出典の帯の高さ（--cred、mapLayout で測る）の上に置く */
  .val{font-size:22px}
  .msg{font-size:15px}
  #hint{font-size:16px}
}
</style>
</head>
<body>
<canvas id="view"></canvas>

<!-- 地図の画面 -->
<div id="mapUI">
  <div id="mapLabels"></div>
  <div id="legend"></div>
  <div id="toast" class="hide"></div>
  <div id="mapTop"><div class="t">家をえらぶ</div><div class="s">地図を寄せて、建物をタップ</div>
    <form id="addr" autocomplete="off" role="search" onsubmit="return false">
      <input id="addrIn" type="text" enterkeyhint="search" placeholder="住所で探す　例：塚越4-16" aria-label="住所で探す" aria-autocomplete="list" aria-controls="addrList" spellcheck="false">
      <button id="addrClr" type="button" class="hide" aria-label="住所を消す">×</button>
      <div id="addrList" class="hide" role="listbox"></div>
    </form>
  </div>
  <div id="zoom"><button id="zIn" type="button" aria-label="寄せる">＋</button><button id="zOut" type="button" aria-label="引く">−</button></div>
  <button id="compass" type="button" aria-label="方位磁針。押すと北を上にする"><svg viewBox="0 0 44 44" aria-hidden="true"><g id="needle">
    <text x="22" y="10.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">北</text>
    <polygon points="22,12 26.5,22 17.5,22" fill="#e8434c"/><polygon points="22,34 26.5,22 17.5,22" fill="#dfe6ea"/>
  </g></svg></button>
  <div id="pick" class="hide"><div id="pickInfo"></div><button id="pickGo" type="button">この家にする</button></div>
  <div id="floorAsk" class="hide">
    <div class="q">何階に住んでいますか</div>
    <div class="row2"><button id="fDown" type="button" aria-label="1つ下の階">−</button><span id="floorVal">1階</span><button id="fUp" type="button" aria-label="1つ上の階">＋</button></div>
    <button id="floorGo" type="button">この階にする</button>
  </div>
  <div id="credit">建物・浸水深：国土交通省 PLATEAU <a href="https://www.geospatial.jp/ckan/dataset/plateau-11223-warabi-shi-2024" target="_blank" rel="noopener">蕨市（2024年度）</a>・<a href="https://www.geospatial.jp/ckan/dataset/plateau-11224-toda-shi-2022" target="_blank" rel="noopener">戸田市（2022年度）</a>・<a href="https://www.geospatial.jp/ckan/dataset/plateau-11203-kawaguchi-shi-2024" target="_blank" rel="noopener">川口市（2024年度）</a>を加工して作成　川・道路・鉄道・駅名：<a href="https://maps.gsi.go.jp/development/vt.html" target="_blank" rel="noopener">国土地理院 ベクトルタイル</a>を加工して作成　駅の位置・住所：国土交通省 <a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N02-2023.html" target="_blank" rel="noopener">国土数値情報（鉄道）</a>・<a href="https://nlftp.mlit.go.jp/isj/" target="_blank" rel="noopener">位置参照情報</a>を加工して作成</div>
</div>

<!-- 居間の画面 -->
<div id="roomUI" class="hide">
  <div id="under"></div>
  <div id="hud">
    <div id="hudRow">
      <div class="box">
        <div class="lab">3日間の雨</div>
        <div class="val"><span id="rainVal">0</span><small>mm</small></div>
        <div id="rainSub"></div>
      </div>
      <div class="box" id="depthBox">
        <div class="lab" id="depthLab">この家の水の深さ</div>
        <div class="val"><span id="depthVal">0.00</span><small>m</small></div>
      </div>
    </div>
    <div id="meter"><div id="meterFill"></div></div>
  </div>
  <div id="hint"><span class="hand"></span>画面をこすって、雨を降らせる</div>
  <div id="alert"><span class="at"></span><span class="tag">想定</span></div>
  <div id="msgs"></div>
  <button id="stop" type="button" class="hide">ここまでにする</button>
  <div id="note">目安</div>
</div>

<!-- 結果 -->
<div id="result" aria-hidden="true">
  <div class="card">
    <div id="resRows"></div>
    <div class="warn" id="resWarn">上の階に逃げても、何日も取り残されます。早めに浸水する場所の外へ</div>
    <div class="btns"><button id="again" type="button">もう一度</button><button id="rePick" type="button">家を選びなおす</button></div>
    <details class="src"><summary>出典</summary><div id="resSrc"></div></details>
  </div>
</div>

<script src="three.min.js"></script>
<script src="buildings_3cities.js"></script>
<script src="map_layers.js"></script>
<script src="addresses_3cities.js"></script>
<script>
"use strict";

/* =====================================================================
   調整しやすい値（ここにまとめる）
   ===================================================================== */
const CONFIG = {
  /* 地面から1階の床までの高さ（m）。仮 */
  floorHeight: 0.45,

  /* 床からの高さ（m）。家具の形もこの値で作る。一般的な目安（仮） */
  heights: {
    ceiling: 2.40,
    outlet: 0.25,
    tableTop: 0.35,
    tableFloat: 0.12,
    sofaSeat: 0.40,
    sofaBack: 0.80,
    tvStand: 0.40,
    tvTop: 1.10,
    sinkCounter: 0.85,
    fridge: 1.80,
    clock: 1.95
  },

  /* こすり方。画面の短い辺1つ分こすると mmPerScreen mm 増える。
     1秒に増える量は maxMmPerSec まで（632/20 なら、最速で20秒）。
     ふつうにこすると1秒に画面2〜3つ分くらいなので、だいたい25〜30秒で632mmに届く。 */
  rub: {
    mmPerScreen: 8.5,
    maxMmPerSec: 632 / 20
  },

  /* 雨の増え方を段階で変える（上の rub にかける倍率）。
     まだ何も起きない間（〜299mm）は速く進め、荒川の知らせが出る間は少しゆっくり、
     水がこちらに向かってからは、上がっていく様子を見ていられるようにゆっくりにする。
     一言を読んでいる間は、さらに reading をかける */
  pace: { early: 2.5, warn: 0.8, flood: 0.35, reading: 0.4 },

  /* 水位が雨の量に追いつく速さ（m/秒） */
  waterSpeed: 0.4,

  /* 最後に水が引く場面の秒数 */
  drainSec: 3.2,

  /* 飲み水の目安（首相官邸「災害への備え」：1人1日3リットル） */
  waterPerDayL: 3,

  /* 壁の時計：雨が0mmのときの時刻（分）と、632mmで進む時間（3日間） */
  clockStartMinutes: 300,
  clockHoursAtMax: 72
};

/* 荒川流域の3日間の雨の量の目盛り（国交省の図の注記。調べ_浸水体験の案.md 結論1）。
   417mmで戸田・川口、467mmで蕨に水が来る（国の図の「関係市区町」）。 */
const RAIN_STEPS = [
  { mm: 299, label: "10年に1回", text: "10年に1回の雨の量" },
  { mm: 380, label: "30年に1回", text: "30年に1回の雨の量" },
  { mm: 417, label: "50年に1回", text: "50年に1回の雨の量。\n戸田と川口に水が来た" },
  { mm: 467, label: "100年に1回", text: "100年に1回の雨の量。\n蕨に水が来た" },
  { mm: 516, label: "200年に1回", text: "200年に1回の雨の量" },
  { mm: 632, label: "想定最大", text: "想定される最大の雨の量" }
];
const MM_ZERO = 467, MM_L1 = 516, MM_MAX = 632;

/* 沈んだときの一言。at は「床からの高さ（m）」。仮の文。 */
const H = CONFIG.heights;
/* 地面から、いる部屋の床までの高さ（m）。1階は CONFIG.floorHeight。上の階は enterRoom で決める */
let FH = CONFIG.floorHeight;

{

      h: r[5] / 10, city: r[6], pts, x0, y0, x1, y1
    });
    if (x0 < minX) minX = x0; if (y0 < minY) minY = y0; if (x1 > maxX) maxX = x1; if (y1 > maxY) maxY = y1;
    const cb = CITY_BOUNDS[r[6]];
    if (x0 < cb.minX) cb.minX = x0; if (y0 < cb.minY) cb.minY = y0; if (x1 > cb.maxX) cb.maxX = x1; if (y1 > cb.maxY) cb.maxY = y1;
  }

}

const mmZeroOf = b => (b && CITIES[b.city] && CITIES[b.city].mmZero) || MM_ZERO;

/* 雨の量から、その家の深さ（地面から、m）。市の浸かり始め（蕨467mm・戸田と川口417mm）で0、516mmでL1、632mmでL2、間は直線。
   L1が0か無ければ、浸かり始めから632mmまでを直線で */
function depthForRain(mm, b) {
  const z0 = mmZeroOf(b);
  if (!b || mm <= z0) return 0;
  const m = Math.min(mm, MM_MAX);
  if (b.l1 && b.l1 > 0) {
    if (m <= MM_L1) return b.l1 * (m - z0) / (MM_L1 - z0);
    return b.l1 + (b.l2 - b.l1) * (m - MM_L1) / (MM_MAX - MM_L1);
  }
  return b.l2 * (m - z0) / (MM_MAX - z0);
}
function stepAt(mm) {
  let s = null;
  for (const r of RAIN_STEPS) if (mm >= r.mm) s = r;
  return s;
}

function lonLatToPx(lon, lat) {
  const n = 256 * Math.pow(2, W.z);
  const s = Math.sin(lat * Math.PI / 180);
  return [(lon + 180) / 360 * n - W.ox, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n - W.oy];
}

/* 建物：8万棟を、600m四方の区画ごとに1つの形にまとめる（法線は描くときに面から求める）。
   区画ごとに「壁と屋根」と「屋根だけ」の2つを作り、カメラから遠い区画は屋根だけを描いて軽くする。
   画面の外の区画は three が描かない。 */
const CHUNK_M = 600;
const bldChunks = [];

/* 屋根の三角形：凸なら扇形に分け（速い）、へこみがあれば three の分割を使う */
function roofTriangles(xs, zs, n) {
  let sign = 0, convex = true;
  for (let k = 0; k < n && convex; k++) {
    const a = k, b = (k + 1) % n, c = (k + 2) % n;
    const cr = (xs[b] - xs[a]) * (zs[c] - zs[b]) - (zs[b] - zs[a]) * (xs[c] - xs[b]);
    if (Math.abs(cr) < 1e-9) continue;
    const s = cr > 0 ? 1 : -1;
    if (sign === 0) sign = s; else if (s !== sign) convex = false;
  }
  if (convex) {
    const t = [];
    for (let k = 1; k < n - 1; k++) t.push([0, k, k + 1]);
    return t;
  }
  const contour = [];
  for (let k = 0; k < n; k++) contour.push(new THREE.Vector2(xs[k], zs[k]));
  try { return THREE.ShapeUtils.triangulateShape(contour, []); } catch (e) { return []; }
}

/* list の建物を1つの形にする。roofOnly なら屋根だけ。faceB には、面の番号→建物の番号を入れる */
function buildingGeometry(list, lift, colorOf, roofOnly) {
  let nv = 0, nt = 0;
  for (const i of list) {
    const n = BLD[i].pts.length / 2;
    nv += roofOnly ? n : 2 * n;
    nt += roofOnly ? n - 2 : 3 * n - 2;
  }
  const pos = new Float32Array(nv * 3);
  const col = colorOf ? new Float32Array(nv * 3) : null;
  const idx = nv > 65535 ? new Uint32Array(nt * 3) : new Uint16Array(nt * 3);
  const faceB = new Uint32Array(nt);
  let v = 0, f = 0;
  const xs = [], zs = [];
  for (const i of list) {
    const b = BLD[i];
    const p = b.pts, n = p.length / 2, h = b.h + lift;
    const base = v;
    for (let k = 0; k < n; k++) { xs[k] = mX(p[2 * k]); zs[k] = mZ(p[2 * k + 1]); }
    const top = roofOnly ? base : base + n;
    for (let k = 0; k < n; k++) {
      if (!roofOnly) { pos[(base + k) * 3] = xs[k]; pos[(base + k) * 3 + 1] = 0; pos[(base + k) * 3 + 2] = zs[k]; }
      pos[(top + k) * 3] = xs[k]; pos[(top + k) * 3 + 1] = h; pos[(top + k) * 3 + 2] = zs[k];
    }
    const cnt = roofOnly ? n : 2 * n;
    if (col) {
      const c = colorOf(i);
      for (let k = 0; k < cnt; k++) { col[(base + k) * 3] = c.r; col[(base + k) * 3 + 1] = c.g; col[(base + k) * 3 + 2] = c.b; }
    }
    if (!roofOnly) {
      for (let k = 0; k < n; k++) {
        const k2 = (k + 1) % n;
        idx[f * 3] = base + k; idx[f * 3 + 1] = base + k2; idx[f * 3 + 2] = base + n + k2; faceB[f++] = i;
        idx[f * 3] = base + k; idx[f * 3 + 1] = base + n + k2; idx[f * 3 + 2] = base + n + k; faceB[f++] = i;
      }
    }
    for (const t of roofTriangles(xs, zs, n)) {
      if (f >= nt) break;
      idx[f * 3] = top + t[0]; idx[f * 3 + 1] = top + t[1]; idx[f * 3 + 2] = top + t[2]; faceB[f++] = i;
    }
    v += cnt;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  if (col) g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(idx.subarray(0, f * 3), 1));
  g.computeBoundingSphere();
  g.userData.faceB = faceB;
  return g;
}

/* 浸水深の色：国土交通省「水害ハザードマップ作成の手引き」（平成28年4月）3.4.1 の標準の6段階（図3-3）。
   区切りは 0.5m・3m・5m・10m・20m。蕨の建物にある段階だけ凡例に出す。 */
const DEPTH_CLASSES = [
  { max: 0.5, label: "0.5m未満", rgb: [247, 245, 169] },
  { max: 3, label: "0.5〜3m", rgb: [255, 216, 192] },
  { max: 5, label: "3〜5m", rgb: [255, 183, 183] },
  { max: 10, label: "5〜10m", rgb: [255, 145, 145] },
  { max: 20, label: "10〜20m", rgb: [242, 133, 201] },
  { max: Infinity, label: "20m以上", rgb: [220, 122, 220] }
];
const DRY_COLOR = new THREE.Color(0xc3ccd4);
function depthClass(d) {
  if (!(d > 0)) return -1;
  return DEPTH_CLASSES.findIndex(c => d < c.max);
}
/* 住まいとして選べる用途 */
const HOME_USAGES = ["住宅", "共同住宅", "店舗等併用住宅", "店舗等併用共同住宅", "作業所併用住宅"];
const FLAT_USAGES = ["共同住宅", "店舗等併用共同住宅"];
const isHome = i => HOME_USAGES.includes(BLD[i].usage);
const FADE_TO = new THREE.Color(0xeceef0);
function buildingColor(i) {
  const k = depthClass(BLD[i].l2);
  const c = k < 0 ? DRY_COLOR.clone() : new THREE.Color(DEPTH_CLASSES[k].rgb[0] / 255, DEPTH_CLASSES[k].rgb[1] / 255, DEPTH_CLASSES[k].rgb[2] / 255);
  /* 住まい以外は少し薄くする（選べないことが分かる程度） */
  if (!isHome(i)) c.lerp(FADE_TO, 0.55);
  return c;
}
/* 地図の建物の形は、地図を出すときに作る（アドレスで居間から開いたときは作らずに済む） */
function ensureMapBuildings() {
  if (bldChunks.length) return;
  const bmat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, flatShading: true, side: THREE.DoubleSide });
  /* 屋根だけの区画は壁の影が無く白っぽく見えるので、少し暗くして、近くの立体と色の濃さをそろえる */
  const roofMat = new THREE.MeshLambertMaterial({ color: 0xc4c4c4, vertexColors: true, flatShading: true, side: THREE.DoubleSide });
  const groups = new Map();
  BLD.forEach((b, i) => {
    const k = Math.floor(mX((b.x0 + b.x1) / 2) / CHUNK_M) + "," + Math.floor(mZ((b.y0 + b.y1) / 2) / CHUNK_M);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  });
  for (const list of groups.values()) {
    const full = new THREE.Mesh(buildingGeometry(list, 0, buildingColor, false), bmat);
    const roof = new THREE.Mesh(buildingGeometry(list, 0, buildingColor, true), roofMat);
    roof.visible = false;
    mapScene.add(full, roof);
    bldChunks.push({ full, roof, c: full.geometry.boundingSphere.center.clone() });
  }
}
{

const _pv = new THREE.Vector3();
function updateLabels() {
  const w = innerWidth, h = innerHeight;
  for (const l of mapLabels) {
    _pv.copy(l.v).project(mapCam);
    if (_pv.z > 1 || _pv.x < -1.2 || _pv.x > 1.2 || _pv.y < -1.2 || _pv.y > 1.2) { l.el.style.display = "none"; continue; }
    l.el.style.display = "";
    /* 画面の端で切れないよう、左右だけ内側に寄せる。駅は印が線路からずれないよう寄せない */
    const half = (l.w || (l.w = l.el.offsetWidth)) / 2;
    const px0 = (_pv.x + 1) / 2 * w;
    if (l.pin && (px0 < half || px0 > w - half)) { l.el.style.display = "none"; continue; }
    const sx = l.pin ? px0 : Math.max(half + 6, Math.min(w - half - 6, px0));
    l.el.style.transform = "translate(" + (sx - half).toFixed(1) + "px," + ((1 - _pv.y) / 2 * h).toFixed(1) + "px) translate(0,-100%)";
  }
}

/* 当たり判定の升目（ズーム20のピクセルで400＝約50m）。立体に当たらなかったときの予備 */
const GRID = 400;
const grid = new Map();
BLD.forEach((b, i) => {
  for (let gx = Math.floor(b.x0 / GRID); gx <= Math.floor(b.x1 / GRID); gx++) {
    for (let gy = Math.floor(b.y0 / GRID); gy <= Math.floor(b.y1 / GRID); gy++) {
      const k = gx + "," + gy;
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(i);
    }
  }
});
function inPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
    const xi = pts[i], yi = pts[i + 1], xj = pts[j], yj = pts[j + 1];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function hitBuilding(px, py) {
  const list = grid.get(Math.floor(px / GRID) + "," + Math.floor(py / GRID)) || [];
  for (const i of list) {
    const b = BLD[i];
    if (px < b.x0 || px > b.x1 || py < b.y0 || py > b.y1) continue;
    if (inPoly(px, py, b.pts)) return i;
  }
  return -1;
}

/* 選んだ家から、堤防が切れる想定の場所（近い方）までの直線距離（m） */
function distToBreach(i) {
  const b = BLD[i];
  const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  let d = Infinity;
  for (const p of BREACH) d = Math.min(d, Math.hypot(cx - p.px, cy - p.py) * KM);
  return d;
}

let toastTimer = 0;
function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.remove("hide");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hide"), 1800);
}
/* note は住所で選んだときの一行（「塚越四丁目16番の近く」） */
function selectBuilding(i, note) {
  selected = i;

    '<div class="far">荒川から約' + (distToBreach(i) / 1000).toFixed(1) + 'km</div>';
  if (note) document.querySelector("#pickInfo .adr").textContent = note;
  pick.classList.remove("hide");
}

/* カメラ：見る点（地面）・距離・向き。寄るほど斜めに、引くほど上から */
const mapCtl = { tx: 0, tz: 0, dist: 6000, yaw: 0 };
const DIST_MIN = 120, DIST_MAX = 16000;
function mapPitch() {
  const t = Math.log(mapCtl.dist / DIST_MIN) / Math.log(DIST_MAX / DIST_MIN);
  return 0.6 + 0.45 * Math.max(0, Math.min(1, t));
}
function placeMapCam() {
  const p = mapPitch();
  mapCam.position.set(
    mapCtl.tx + mapCtl.dist * Math.cos(p) * Math.sin(mapCtl.yaw),
    mapCtl.dist * Math.sin(p),
    mapCtl.tz + mapCtl.dist * Math.cos(p) * Math.cos(mapCtl.yaw));
  mapCam.lookAt(mapCtl.tx, 0, mapCtl.tz);
  mapCam.updateMatrixWorld();
  mapNeedsRender = true;
}
const _ray = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const _plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const _hit = new THREE.Vector3();
function groundAt(sx, sy) {
  _ndc.set(sx / innerWidth * 2 - 1, -(sy / innerHeight) * 2 + 1);
  _ray.setFromCamera(_ndc, mapCam);
  return _ray.ray.intersectPlane(_plane, _hit) ? _hit.clone() : null;
}
function mapZoomAt(sx, sy, f) {
  const a = groundAt(sx, sy);
  mapCtl.dist = Math.max(DIST_MIN, Math.min(DIST_MAX, mapCtl.dist * f));
  placeMapCam();
  const b = groundAt(sx, sy);
  if (a && b) { mapCtl.tx += a.x - b.x; mapCtl.tz += a.z - b.z; placeMapCam(); }
}
function mapPan(dx, dy) {
  const a = groundAt(innerWidth / 2, innerHeight / 2);
  const b = groundAt(innerWidth / 2 + dx, innerHeight / 2 + dy);
  if (a && b) { mapCtl.tx -= b.x - a.x; mapCtl.tz -= b.z - a.z; placeMapCam(); }
}
function mapResize() {
  /* 地図は建物が多いので、画素の細かさを1.5倍までにして軽くする */
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight, false);
  mapCam.aspect = innerWidth / innerHeight;
  mapCam.updateProjectionMatrix();
  placeMapCam();
  mapLayout();
}
/* 最初の見え方：町が少なく見えないよう、寄せて始める。
   奥に蕨の町のまん中、手前に荒川と破堤点。左右は、破堤点の少し西から川口の西川口あたりまで（縦長の画面は狭くする） */
function mapFit() {
  const portrait = innerWidth < innerHeight;
  const bx = Math.min(...BREACH.map(b => mX(b.px)));
  const wz = mZ((CITY_BOUNDS[0].minY + CITY_BOUNDS[0].maxY) / 2);
  const x0 = bx - (portrait ? 100 : 400), x1 = bx + (portrait ? 2700 : 4200);
  const z0 = wz - (portrait ? 0 : 300), z1 = mZ(BREACH[0].py) + (portrait ? 250 : 650);
  mapCtl.tx = (x0 + x1) / 2;
  mapCtl.tz = (z0 + z1) / 2;
  mapCtl.yaw = 0;
  const a = innerWidth / innerHeight;
  const vf = mapCam.fov * Math.PI / 180;
  const hf = 2 * Math.atan(Math.tan(vf / 2) * a);
  mapCtl.dist = 3000;
  for (let k = 0; k < 6; k++) {
    const p = mapPitch();
    const dw = (x1 - x0) / 2 / Math.tan(hf / 2);
    const dd = ((z1 - z0) * Math.sin(p) + 400) / 2 / Math.tan(vf / 2);
    mapCtl.dist = Math.min(DIST_MAX, Math.max(dw, dd) * 1.08);
  }
  placeMapCam();
}
/* 見ている点までの距離より遠い区画は、屋根だけにする */
function updateBuildingLod() {
  const far = mapCtl.dist * 1.35 + 300;
  for (const c of bldChunks) {
    const near = c.c.distanceTo(mapCam.position) < far;
    c.full.visible = near;
    c.roof.visible = !near;
  }
}
function renderMap() {
  updateBuildingLod();
  renderer.render(mapScene, mapCam);
  updateLabels();
  updateCompass();
  window.__mapFrames++;
}
function pickAt(sx, sy) {
  _ndc.set(sx / innerWidth * 2 - 1, -(sy / innerHeight) * 2 + 1);
  _ray.setFromCamera(_ndc, mapCam);
  /* 当たりは、壁と屋根のある形で調べる（遠くで屋根だけを描いている区画も同じ） */
  const hits = _ray.intersectObjects(bldChunks.map(c => c.full), false);
  if (hits.length) return hits[0].object.geometry.userData.faceB[hits[0].faceIndex];
  const g = groundAt(sx, sy);
  if (!g) return -1;
  return hitBuilding(g.x / KM + MCX, g.z / KM + MCY);
}

/* 地図の操作：1本指（マウス）で動かす、2本指でつまむ・回す、ホイールで寄る、タップで選ぶ。
   マウスの右ボタンで動かすと回る */
{
  const ptrs = new Map();
  let tap = null, two = null;
  viewCanvas.addEventListener("contextmenu", e => { if (G.phase === "map") e.preventDefault(); });
  viewCanvas.addEventListener("pointerdown", e => {
    if (G.phase !== "map") return;
    closeAddrList(true);
    try { viewCanvas.setPointerCapture(e.pointerId); } catch (err) { /* 何もしない */ }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
    if (ptrs.size === 1) tap = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
    else { tap = null; two = null; }
  });
  viewCanvas.addEventListener("pointermove", e => {
    if (G.phase !== "map") return;
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      if (tap) tap.moved += Math.abs(dx) + Math.abs(dy);
      if (p.btn === 2 || e.shiftKey) { mapCtl.yaw += dx * 0.006; placeMapCam(); }
      else mapPan(dx, dy);
    } else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      if (two) {
        mapPan(mx - two.mx, my - two.my);
        let da = ang - two.ang;
        if (da > Math.PI) da -= 2 * Math.PI;
        if (da < -Math.PI) da += 2 * Math.PI;
        mapCtl.yaw += da;
        mapZoomAt(mx, my, two.d / d);
      }
      two = { d, ang, mx, my };
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) two = null;
    if (G.phase === "map" && tap && ptrs.size === 0 && tap.moved < 10 && performance.now() - tap.t < 600) {
      const hit = pickAt(e.clientX, e.clientY);
      if (hit >= 0 && !isHome(hit)) showToast("住まいを選んでください");
      else selectBuilding(hit);
    }
    if (ptrs.size === 0) tap = null;
  };
  viewCanvas.addEventListener("pointerup", up);
  viewCanvas.addEventListener("pointercancel", up);
  viewCanvas.addEventListener("wheel", e => {
    if (G.phase !== "map") return;
    e.preventDefault();
    mapZoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * 0.0015));
  }, { passive: false });
  document.getElementById("zIn").addEventListener("click", () => mapZoomAt(innerWidth / 2, innerHeight / 2, 0.5));
  document.getElementById("zOut").addEventListener("click", () => mapZoomAt(innerWidth / 2, innerHeight / 2, 2));
}

/* =====================================================================
   住所で探す。国土交通省 位置参照情報の街区（○丁目○番）の代表点（addresses_3cities.js）と、
   このページの中だけで照合する。入れた住所はどこにも送らない
   ===================================================================== */
const AD = window.ADDR;
const ADDR_OUT = "この試作は蕨・戸田・川口の荒川寄りだけです";
const KNUM = { "〇": 0, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
function kanjiNum(s) {
  let n = 0, cur = 0;
  for (const ch of s) {
    if (ch === "十") { n += (cur || 1) * 10; cur = 0; }
    else if (ch === "百") { n += (cur || 1) * 100; cur = 0; }
    else cur = cur * 10 + KNUM[ch];
  }
  return n + cur;
}
/* 表記ゆれをそろえる：全角→半角、空白を消す、「四丁目」→「4-」、「16番地の3」「16番3号」→「16-3」、「4の16」→「4-16」、
   いろいろな横棒→「-」、「ヶ・ヵ」→「ケ」、「の」→「ノ」 */
function addrNorm(s) {
  s = String(s || "").normalize("NFKC").replace(/[\s　]+/g, "");
  s = s.replace(/^埼玉県/, "");
  s = s.replace(/([〇一二三四五六七八九十百]+)丁目/g, (m, k) => kanjiNum(k) + "丁目");
  s = s.replace(/(\d)(丁目|番地|番|号)/g, "$1-");
  s = s.replace(/-[のノ](?=\d)/g, "-");
  s = s.replace(/(\d)[‐‑‒–—―−ーｰ─━~〜のノ](?=\d)/g, "$1-");
  s = s.replace(/[ヶヵ]/g, "ケ").replace(/の/g, "ノ");
  s = s.replace(/-+/g, "-").replace(/^-|-$/g, "");
  return s;
}
const ADDR_TOWNS = AD.towns.map((t, i) => {
  const m = t[1].match(/^(?:大字)?(.+?)([〇一二三四五六七八九十]+)丁目$/);
  return {
    i, city: t[0], name: t[1], base: addrNorm(m ? m[1] : t[1].replace(/^大字/, "")),
    chome: m ? kanjiNum(m[2]) : null, blocks: new Map(), cx: 0, cy: 0, out: AD.out[i] || ""
  };
});
for (let k = 0; k < AD.b.length; k += 4) ADDR_TOWNS[AD.b[k]].blocks.set(AD.b[k + 1], [AD.b[k + 2], AD.b[k + 3]]);
for (const T of ADDR_TOWNS) {
  let sx = 0, sy = 0;
  for (const p of T.blocks.values()) { sx += p[0]; sy += p[1]; }
  if (T.blocks.size) { T.cx = sx / T.blocks.size; T.cy = sy / T.blocks.size; }
}
const blkWord = T => (T.name.startsWith("大字") ? "番地" : "番");

/* 候補を返す。score：0＝番まで合った、1＝町は合ったが番が無い、2＝町だけ、3＝町の名前の書きかけ */
function addrSearch(q) {
  const s0 = addrNorm(q);
  if (!s0) return null;
  const tries = [];
  let m = s0.match(/^(蕨市|戸田市|川口市)(.*)$/);
  if (m) tries.push({ city: AD.cities.indexOf(m[1]), rest: m[2] });
  else {
    tries.push({ city: -1, rest: s0 });
    /* 「市」を書かずに「蕨塚越4-16」と入れたとき（「戸田公園」「川口1丁目」は町の名前でもあるので、両方試す） */
    m = s0.match(/^(蕨|戸田|川口)(.*)$/);
    if (m) tries.push({ city: AD.cities.indexOf(m[1] + "市"), rest: m[2] });
  }
  const res = [], seen = new Set();
  let outside = false;
  const add = c => { const k = c.t.i + "/" + (c.blk || ""); if (!seen.has(k)) { seen.add(k); res.push(c); } };
  for (const tr of tries) {
    const rest = tr.rest.replace(/^大?字/, "");
    const base = rest.match(/^[^\d-]*/)[0];
    const nums = (rest.slice(base.length).match(/\d+/g) || []).map(n => String(parseInt(n, 10)));
    for (const T of ADDR_TOWNS) {
      if (tr.city >= 0 && T.city !== tr.city) continue;
      if (T.base !== base) {
        if (nums.length || !(base ? T.base.startsWith(base) : tr.city >= 0)) continue;
        if (T.out !== "*") add({ t: T, score: 3 });
        continue;
      }
      let blk = null;
      if (T.chome !== null) {
        if (nums.length && +nums[0] !== T.chome) continue;
        blk = nums[1] || null;
      } else blk = nums[0] || null;
      if (T.out === "*") { outside = true; continue; }
      if (blk) {
        if (T.blocks.has(blk)) add({ t: T, blk, score: 0 });
        else if (T.out.split(",").includes(blk)) outside = true;
        else add({ t: T, score: 1, miss: blk });
      } else add({ t: T, score: nums.length ? 1 : 2 });
    }
  }
  res.sort((a, b) => a.score - b.score || a.t.city - b.t.city || a.t.base.localeCompare(b.t.base, "ja") || (a.t.chome || 0) - (b.t.chome || 0));
  return { list: res.slice(0, 8), outside };
}

/* 街区の代表点から、いちばん近い住まいの建物（maxM m まで）。点が建物の中なら、その建物 */
function nearestHome(x, y, maxM) {
  const R = maxM / KM, n = Math.ceil(R / GRID);
  const gx = Math.floor(x / GRID), gy = Math.floor(y / GRID);
  let best = -1, bd = R;
  const done = new Set();
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    for (const k of grid.get((gx + i) + "," + (gy + j)) || []) {
      if (done.has(k) || !isHome(k)) continue;
      done.add(k);
      const b = BLD[k];
      const d = inPoly(x, y, b.pts) ? -1 : Math.hypot(Math.max(b.x0 - x, 0, x - b.x1), Math.max(b.y0 - y, 0, y - b.y1));
      if (d < bd) { bd = d; best = k; }
    }
  }
  return best;
}

const addrIn = document.getElementById("addrIn");
const addrList = document.getElementById("addrList");
const addrClr = document.getElementById("addrClr");
let addrCands = [], addrOn = 0;
function closeAddrList(blur) {
  addrList.classList.add("hide");
  if (blur && document.activeElement === addrIn) addrIn.blur();
}
function addrMsg(text) {
  addrCands = [];
  addrList.innerHTML = "";
  const d = document.createElement("div");
  d.className = "msg2";
  d.textContent = text;
  addrList.appendChild(d);
  addrList.classList.remove("hide");
}
function addrMark() {
  [...addrList.children].forEach((b, k) => b.classList.toggle("on", k === addrOn));
}
function addrUpdate() {
  const q = addrIn.value;
  addrClr.classList.toggle("hide", !q);
  const r = addrSearch(q);
  if (!r) { addrCands = []; closeAddrList(false); return; }
  if (!r.list.length) {
    addrMsg(/^[\d-]+$/.test(addrNorm(q)) ? "町の名前から入れてください（例：塚越4-16）" : ADDR_OUT);
    return;
  }
  addrCands = r.list;
  addrOn = 0;
  addrList.innerHTML = "";
  r.list.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "option");
    b.textContent = AD.cities[c.t.city] + " " + c.t.name + (c.blk ? " " + c.blk + blkWord(c.t) : "");
    const sub = c.blk ? "" : (c.miss ? c.miss + blkWord(c.t) + "は見つかりません。町の中ほどへ" : "町の中ほどへ");
    if (sub) { const s = document.createElement("small"); s.textContent = sub; b.appendChild(s); }
    b.addEventListener("click", () => addrGo(c));
    addrList.appendChild(b);
  });
  addrMark();
  addrList.classList.remove("hide");
}
/* 選んだ候補へ地図を動かし、番まで分かっていれば、いちばん近い住まいを選ぶ */
function addrGo(c) {
  const T = c.t;
  const p = c.blk ? T.blocks.get(c.blk) : [T.cx, T.cy];
  addrIn.value = AD.cities[T.city] + T.name + (c.blk ? c.blk + blkWord(T) : "");
  addrClr.classList.remove("hide");
  closeAddrList(true);
  const near = c.blk ? nearestHome(p[0], p[1], AD.near_m) : -1;
  if (near >= 0) {
    const b = BLD[near];
    mapCtl.tx = mX((b.x0 + b.x1) / 2);
    mapCtl.tz = mZ((b.y0 + b.y1) / 2);
    mapCtl.dist = 520;
    placeMapCam();
    selectBuilding(near, T.name + c.blk + blkWord(T) + "の近く");
  } else {
    mapCtl.tx = mX(p[0]);
    mapCtl.tz = mZ(p[1]);
    mapCtl.dist = c.blk ? 520 : 1100;
    placeMapCam();
    selectBuilding(-1);
    showToast("住まいの建物をタップしてください");
  }
}
/* 住所を打ち直したら、前に選んだ家の欄は閉じる（新しい住所と取り違えないように） */
addrIn.addEventListener("input", () => { if (selected >= 0) selectBuilding(-1); addrUpdate(); });
addrIn.addEventListener("focus", () => { if (addrIn.value) addrUpdate(); });
addrIn.addEventListener("keydown", e => {
  /* 日本語の変換中の Enter は、変換を決めるためのものなので使わない */
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter") {
    e.preventDefault();
    if (addrCands.length) addrGo(addrCands[addrOn]);
  } else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && addrCands.length) {
    e.preventDefault();
    addrOn = (addrOn + (e.key === "ArrowDown" ? 1 : addrCands.length - 1)) % addrCands.length;
    addrMark();
  } else if (e.key === "Escape") closeAddrList(true);
});
addrClr.addEventListener("click", () => { addrIn.value = ""; addrUpdate(); addrIn.focus(); });

/* 方位磁針：見ている点と、その200m北の点を画面に写して、北の向きを出す */
const needleEl = document.getElementById("needle");
const _cp0 = new THREE.Vector3(), _cp1 = new THREE.Vector3();
function updateCompass() {
  _cp0.set(mapCtl.tx, 0, mapCtl.tz).project(mapCam);
  _cp1.set(mapCtl.tx, 0, mapCtl.tz - 200).project(mapCam);
  const deg = Math.atan2((_cp1.x - _cp0.x) * innerWidth, (_cp1.y - _cp0.y) * innerHeight) * 180 / Math.PI;

function box(w, h, d, m, x, y, z, shadow) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);

  if (shadow !== false) { mesh.castShadow = true; mesh.receiveShadow = true; }

/* 角の丸い箱。中心が原点 */
function rbox(w, h, d, r, m) {
  const b = Math.min(r * 0.5, w / 4, h / 4, d / 4);
  const iw = w - 2 * b, ih = h - 2 * b, rc = Math.min(r * 0.5, iw / 2 - 1e-3, ih / 2 - 1e-3);
  const s = new THREE.Shape();
  const x0 = -iw / 2, y0 = -ih / 2;
  s.moveTo(x0 + rc, y0);
  s.lineTo(x0 + iw - rc, y0);
  s.quadraticCurveTo(x0 + iw, y0, x0 + iw, y0 + rc);
  s.lineTo(x0 + iw, y0 + ih - rc);
  s.quadraticCurveTo(x0 + iw, y0 + ih, x0 + iw - rc, y0 + ih);
  s.lineTo(x0 + rc, y0 + ih);
  s.quadraticCurveTo(x0, y0 + ih, x0, y0 + ih - rc);
  s.lineTo(x0, y0 + rc);
  s.quadraticCurveTo(x0, y0, x0 + rc, y0);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: Math.max(1e-3, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b,
    bevelSegments: 3, curveSegments: 4
  });
  g.center();
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = 4;
  return t;
}

/* 寄棟の屋根（四方に傾く）。w×d は軒の出を含めた大きさ */
function hipRoofGeometry(w, d, rise) {
  const hw = w / 2, hd = d / 2, rl = Math.max(0, hw - hd);
  const v = [
    -hw, 0, hd, hw, 0, hd, hw, 0, -hd, -hw, 0, -hd,
    -rl, rise, 0, rl, rise, 0
  ];
  const idx = [0, 1, 5, 0, 5, 4, 2, 3, 4, 2, 4, 5, 3, 0, 4, 1, 2, 5, 0, 3, 2, 0, 2, 1];
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
  g.setIndex(idx);
  const uv = [0, 0, w / 2, 0, w / 2, d / 2, 0, d / 2, w / 4 - rl / 2, rise, w / 4 + rl / 2, rise];
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv.map(x => x / 2), 2));
  g.computeVertexNormals();
  return g;
}
/* 切妻の屋根（前と後ろに傾く）：2枚の板 */
function gableRoof(g, cx, cz, top, w, d, oh, rise, rm) {
  const half = d / 2, ang = Math.atan2(rise, half);
  const drop = rise * oh / half;
  const len = Math.hypot(half + oh, rise + drop);
  for (const s of [-1, 1]) {
    const slab = new THREE.Mesh(new THREE.BoxGeometry(w + 2 * oh, 0.12, len), rm);
    slab.rotation.x = s * ang;
    slab.position.set(cx, top + (rise - drop) / 2 + 0.06, cz + s * (half + oh) / 2);
    slab.castShadow = true;
    g.add(slab);
  }

let rippleAcc = 0;
function updateRipples(dt, rain, waterTopY) {
  rippleAcc += dt * (4 + 70 * rain);
  while (rippleAcc > 1) {
    rippleAcc -= 1;
    const r = RIPPLES.find(p => p.t >= 1);
    if (!r) break;
    /* 家の中には落とさない：庭（窓の前）と、道・向かいの家の前 */
    let x, z;
    if (Math.random() < 0.35) { x = -4 + Math.random() * 8; z = -2.6 - Math.random() * 4.2; }
    else { x = -9 + Math.random() * 18; z = -7.9 - Math.random() * 5.6; }
    const groundY = G0 + outside.position.y + 0.02;
    r.m.position.set(x, Math.max(groundY, waterTopY + 0.02), z);
    r.t = 0;
    r.life = 0.5 + Math.random() * 0.4;
    r.size = 0.18 + Math.random() * 0.22;
    r.m.visible = true;
  }
  for (const r of RIPPLES) {
    if (r.t >= 1) continue;
    r.t = Math.min(1, r.t + dt / r.life);
    const s = 0.03 + r.size * r.t;
    r.m.scale.set(s, 1, s);
    r.m.material.opacity = 0.55 * (1 - r.t);
    if (r.t >= 1) r.m.visible = false;
  }
}

const RAIN_N = 1800;
const rainPos = new Float32Array(RAIN_N * 6);
const rainX = new Float32Array(RAIN_N), rainY = new Float32Array(RAIN_N), rainZ = new Float32Array(RAIN_N), rainV = new Float32Array(RAIN_N);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({ color: 0xdfe7ee, transparent: true, opacity: 0.55, depthWrite: false });
const rainLines = new THREE.LineSegments(rainGeo, rainMat);
rainLines.frustumCulled = false;

scene.add(rainLines);
function spawnDrop(i, anywhere) {
  for (let k = 0; k < 20; k++) {
    const x = -12 + Math.random() * 24, z = -22 + Math.random() * 28;
    /* 家の中には降らせない。カメラのすぐ前も避ける */
    if (x > -2.7 && x < 2.7 && z > -2.35 && z < 2.25) continue;
    if (Math.hypot(x - camera.position.x, z - camera.position.z) < 1.6) continue;
    rainX[i] = x; rainZ[i] = z;
    break;
  }
  rainY[i] = anywhere ? -FH + Math.random() * (FH + 6) : 6 + Math.random();
  rainV[i] = 8 + Math.random() * 4;
}
function updateRain(dt, level01) {
  const active = Math.floor(RAIN_N * (0.06 + 0.94 * level01));
  const len = 0.22 + 0.4 * level01, wind = 0.06 + 0.12 * level01;
  const floorY = Math.max(-FH, G.depth > 0.001 ? G.depth - FH : -FH);
  for (let i = 0; i < active; i++) {
    rainY[i] -= rainV[i] * dt * (0.8 + 0.5 * level01);
    if (rainY[i] < floorY) spawnDrop(i, false);
    const o = i * 6;
    rainPos[o] = rainX[i] + wind; rainPos[o + 1] = rainY[i] + len; rainPos[o + 2] = rainZ[i];
    rainPos[o + 3] = rainX[i]; rainPos[o + 4] = rainY[i]; rainPos[o + 5] = rainZ[i];
  }
  rainGeo.setDrawRange(0, active * 2);
  rainGeo.attributes.position.needsUpdate = true;
  rainMat.opacity = 0.3 + 0.45 * level01;
}

/* 雨の音（作った雑音を、強さに合わせて大きく・明るくする） */
let audio = null;
function initAudio() {
  if (audio) { if (audio.ctx.state === "suspended") audio.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      lp = lp * 0.97 + w * 0.03;
      d[i] = w * 0.5 + lp * 4;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass"; filter.frequency.value = 900; filter.Q.value = 0.4;
    const gain = ctx.createGain();
    gain.gain.value = 0;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
    audio = { ctx, filter, gain };
  } catch (e) { audio = null; }
}
/* 決壊のときの、低く短い音 */
function playBreachSound() {
  if (!audio) return;
  try {
    const c = audio.ctx, t0 = c.currentTime;
    const o = c.createOscillator(), og = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(70, t0); o.frequency.exponentialRampToValueAtTime(38, t0 + 1.2);
    og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(0.35, t0 + 0.05); og.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
    o.connect(og); og.connect(c.destination); o.start(t0); o.stop(t0 + 1.5);
  } catch (e) { /* 何もしない */ }
}
function updateAudio(level01) {
  if (!audio) return;
  const t = audio.ctx.currentTime;
  audio.gain.gain.setTargetAtTime(0.3 * Math.pow(level01, 1.3), t, 0.15);
  audio.filter.frequency.setTargetAtTime(700 + 2800 * level01, t, 0.2);
}

/* =====================================================================
   遊びの流れ
   ===================================================================== */
const G = {
  phase: "map", house: -1, mm: 0, depth: 0, maxDepth: 0, pending: 0, intensity: 0, rain: 0.05, wet: 0.08,
  lastRub: -1e9, stepIdx: -1, fired: new Set(), floatT: 0, endT: 0, drainFrom: 0, drainT: 0,
  clockStop: null, hold: false,
  /* 何階か、1つの階の高さ、部屋が沈むか（sink）沈まず窓の外を見るか（window） */
  floor: 1, perFloor: 3, mode: "sink",
  /* 荒川の知らせをどこまで出したか、決壊の演出の残り */
  alertIdx: -1, flash: 0,
  /* 順番待ちの一言、読み終わるまでの時刻、次の一言を出してよい時刻 */
  lineQ: [], readUntil: 0, nextLineAt: 0
};

const el = id => document.getElementById(id);
const elRain = el("rainVal"), elRainSub = el("rainSub"), elDepth = el("depthVal"), elFill = el("meterFill");
const elHint = el("hint"), elStop = el("stop"), elMsgs = el("msgs"), elResult = el("result");
const tickEls = RAIN_STEPS.map(s => {

});

/* 一言は順番待ちにして、1つずつ出す（同じ瞬間に重なっても捨てない）。
   次の一言は、前の一言を読み終わるくらいの時間がたってから出す */
function readMs(text) {
  return Math.max(1700, Math.min(3200, 1100 + 100 * text.replace(/\s/g, "").length));
}
function queueLine(text) { G.lineQ.push(text); }
function isReading() { return G.lineQ.length > 0 || performance.now() < G.readUntil; }
function pumpLines() {
  const now = performance.now();
  if (!G.lineQ.length || now < G.nextLineAt) return;
  const text = G.lineQ.shift();
  const ms = readMs(text);
  G.nextLineAt = now + ms;
  G.readUntil = Math.max(G.readUntil, G.nextLineAt);
  showLine(text, ms + 1600);
  if (window.__lineLog) window.__lineLog.push([Math.round(G.mm), +G.depth.toFixed(2), text, Math.round(now)]);
}
function showLine(text, life) {
  const m = document.createElement("div");
  m.className = "msg";
  m.textContent = text.replace(/。(?=[^\n])/g, "。\n");
  elMsgs.appendChild(m);
  while (elMsgs.children.length > 2) elMsgs.removeChild(elMsgs.firstChild);
  void m.offsetWidth;
  m.classList.add("show");
  setTimeout(() => {
    m.classList.remove("show");
    setTimeout(() => { if (m.parentNode) m.parentNode.removeChild(m); }, 600);
  }, life || 3600);
}

/* 今の雨の増え方の倍率 */
function paceNow() {
  const p = CONFIG.pace;
  const z0 = mmZeroOf(BLD[G.house]);
  /* この家でもう出る一言が残っていなければ、最後まで速く進める（何も起きない時間を作らない） */
  const base = G.mm < RAIN_STEPS[0].mm ? p.early : (G.mm < z0 - 8 ? p.warn : (linesAhead() ? p.flood : p.early));
  /* まだ出ていない一言が待っているなら、雨は増やさない（一言と水がずれないように） */
  if (G.lineQ.length > 0) return 0;
  return base * (isReading() ? p.reading : 1);
}
/* 水の上がり方の倍率：一言が待っている間はほぼ止め、読んでいる間はゆるめる。一言がもう残っていなければ速く */
function waterPaceNow() {
  if (G.lineQ.length > 0) return 0.08;
  if (isReading()) return 0.5;
  return G.mm >= mmZeroOf(BLD[G.house]) && !linesAhead() ? 5 : 1;
}
/* 想定最大の深さまでに、まだ出ていない一言があるか（深さは地面から、m） */
function linesAhead() {
  const maxD = BLD[G.house].l2;
  if (!G.fired.has("road") && 0.01 <= maxD) return true;
  if (G.mode === "window") {
    for (const r of OUTSIDE_LINES) {
      const at = r.at === null ? FH1 + G.perFloor : r.at;
      if (!G.fired.has("o" + r.text) && at <= maxD) return true;
    }
    return false;
  }
  if (!G.fired.has("floor") && FH + 0.005 <= maxD) return true;
  for (const r of RISING_LINES) if (!G.fired.has(r.at) && FH + r.at <= maxD) return true;
  return false;
}

function clockMinutes() {
  return CONFIG.clockStartMinutes + Math.min(G.mm, MM_MAX) / MM_MAX * CONFIG.clockHoursAtMax * 60;
}

/* 越えた目盛りと、沈んだ物の一言を集める（同じフレームで重なったら最後の2つだけ） */
function checkLines(silent) {
  const out = [];
  for (let i = G.stepIdx + 1; i < RAIN_STEPS.length; i++) {
    if (G.mm >= RAIN_STEPS[i].mm) { out.push(RAIN_STEPS[i].text); G.stepIdx = i; } else break;
  }
  const level = G.depth - FH;
  const ra = riverAlerts(BLD[G.house]);
  for (let i = G.alertIdx + 1; i < ra.length; i++) {
    if (G.mm >= ra[i].mm) { G.alertIdx = i; if (!silent) showAlert(ra[i]); } else break;
  }
  if (!G.fired.has("road") && G.depth > 0.01) { G.fired.add("road"); out.push(LINE_ROAD); }
  if (G.mode === "window") {
    /* 部屋まで来ない階：建物のまわりの深さで出す */
    for (const r of OUTSIDE_LINES) {
      const at = r.at === null ? FH1 + G.perFloor : r.at;
      const key = "o" + r.text;
      if (!G.fired.has(key) && G.depth >= at) { G.fired.add(key); out.push(r.text); }
    }
  } else {
    if (!G.fired.has("floor") && level > 0.005) { G.fired.add("floor"); out.push(LINE_FLOOR); }
    for (const r of RISING_LINES) {
      if (!G.fired.has(r.at) && level >= r.at) { G.fired.add(r.at); out.push(r.text); }
    }
  }
  if (G.clockStop === null && level >= H.clock) G.clockStop = clockMinutes();
  if (!silent) for (const t of out) queueLine(t);
}

function resetRoom() {
  Object.assign(G, {
    mm: 0, depth: 0, maxDepth: 0, pending: 0, intensity: 0, rain: 0.05, wet: 0.08, lastRub: -1e9,
    stepIdx: -1, fired: new Set(), floatT: 0, endT: 0, clockStop: null, hold: false, alertIdx: -1, flash: 0,
    lineQ: [], readUntil: 0, nextLineAt: 0
  });
  table.position.copy(TABLE_BASE);
  table.rotation.set(0, 0, 0);
  elMsgs.textContent = "";
  elResult.classList.remove("show");
  elResult.setAttribute("aria-hidden", "true");
  document.body.classList.remove("res");

  elHint.style.opacity = 1;
  for (let i = 0; i < RAIN_N; i++) spawnDrop(i, true);
}

/* 建物の階数（無ければ高さ÷3m）と、1つの階の高さ（高さ÷階数。取れなければ3m。2.5〜4.5mにおさめる） */
function floorsOf(b) {
  return b.storeys > 0 ? b.storeys : Math.max(1, Math.round(b.h / 3));
}
function perFloorOf(b) {
  const n = floorsOf(b);
  const v = b.h > 0 && n > 0 ? b.h / n : 3;
  return Math.max(2.5, Math.min(4.5, v));
}
function enterRoom(i, floor) {
  const b = BLD[i];
  G.house = i;
  G.floor = floor || 1;

  /* 部屋の床の高さ＝1階の床0.45m＋(階−1)×1つの階の高さ */

  el("floorAsk").classList.add("hide");
  el("roomUI").classList.remove("hide");

}
function showMap() {

function startEnding() {

function showResult() {

  elMsgs.textContent = "";

/* 音の準備は少し時間がかかることがあるので、こすり始める前（ボタンを押したとき）に済ませる */
/* 住まいで2階建て以上なら、用途にかかわらず何階かを先に聞く（アパートが「住宅」になっていることがあるため） */
let askFloor = 1;
function showFloor() {
  const n = floorsOf(BLD[selected]);
  el("floorVal").textContent = askFloor + "階";
  el("fDown").disabled = askFloor <= 1;
  el("fUp").disabled = askFloor >= n;
}
el("pickGo").addEventListener("click", () => {
  if (selected < 0) return;
  initAudio();
  const b = BLD[selected];
  if (floorsOf(b) > 1) {
    askFloor = 1;

  }
});
el("fDown").addEventListener("click", () => { askFloor = Math.max(1, askFloor - 1); showFloor(); });
el("fUp").addEventListener("click", () => { askFloor = Math.min(floorsOf(BLD[selected]), askFloor + 1); showFloor(); });
el("floorGo").addEventListener("click", () => enterRoom(selected, askFloor));
elStop.addEventListener("click", () => startEnding());
el("again").addEventListener("click", () => enterRoom(G.house, G.floor));
el("rePick").addEventListener("click", () => showMap());

/* こする：指1本（マウスの左ボタン）で動いた長さ（画面の短い辺を1とする）をためる。
   見回す：指2本で横に動かす（マウスは右ボタン）。こするのと取り違えないよう、2本のときは雨を増やさない */
{
  const ptrs = new Map();
  canvas.addEventListener("contextmenu", e => { if (G.phase !== "map") e.preventDefault(); });
  canvas.addEventListener("pointerdown", e => {
    if (G.phase === "map") return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 何もしない */ }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
    /* 音は、ブラウザが操作と認めたときだけ始める（指の場合は離したとき） */
    if (!navigator.userActivation || navigator.userActivation.isActive) initAudio();
  });
  canvas.addEventListener("pointerup", () => { if (G.phase !== "map") initAudio(); });
  canvas.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (ptrs.size >= 2 || p.btn === 2) {
      /* 2本なら、それぞれの指の動きの半分ずつで回す */
      view.yaw += dx * 0.004 / (ptrs.size >= 2 ? 2 : 1);
      aimCamera();
    } else if (G.phase === "room") {
      G.pending += Math.hypot(dx, dy) / Math.min(innerWidth, innerHeight);
      G.lastRub = performance.now();
    }
    p.x = e.clientX; p.y = e.clientY;
  });
  const up = e => { ptrs.delete(e.pointerId); };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
}

/* カメラ：部屋の中に立った人の目（床から1.5m）。
   沈む部屋：右手前の角に立ち、左奥（テレビと窓）を向く。足もとの床も少し入るよう、やや下を向く。
   沈まない部屋：窓の近くに立ち、窓の外を見下ろす */
const view = { target: new THREE.Vector3(), yaw: 0, min: -0.5, max: 0.5 };
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight, a = w / h;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = a;
  if (G.mode === "window") {
    /* 窓から2mほど下がって立ち、外の町を25度ほど見下ろす。これより下がると、窓の下の枠で向かいの家の1階や車が隠れる。
       縦長の画面は横が狭いので、窓の左寄りに立って、左の窓枠とカーテンが画面に入るようにする */
    const back = a < 1 ? 2.0 : 2.1;
    camera.fov = a < 1 ? 72 : 54;
    const cx = a < 1 ? -1.3 : -0.8;
    camera.position.set(cx, EYE, ZB + back);
    const pitch = (a < 1 ? 24 : 27) * Math.PI / 180, far = 12;
    view.target.set(cx, EYE - far * Math.tan(pitch), ZB + back - far);
  } else {
    /* 横長は48度、縦長は横の見える幅が狭くなりすぎないよう広めにする（歪みが目立たない80度まで） */
    camera.fov = a < 1 ? Math.min(80, 2 * Math.atan(Math.tan(24 * Math.PI / 180) / a) * 180 / Math.PI) : 48;
    camera.position.set(XR - 0.3, EYE, ZF - 0.3);
    /* 縦長は少し下を向けて、天井の照明が画面の上で大きく切れないようにする */
    view.target.set(-1.35, a < 1 ? -0.1 : 0.35, -1.1);
  }
  aimCamera();
  camera.updateProjectionMatrix();
}
function aimCamera() {
  view.yaw = Math.max(view.min, Math.min(view.max, view.yaw));
  const dx = view.target.x - camera.position.x, dz = view.target.z - camera.position.z;
  const c = Math.cos(view.yaw), s = Math.sin(view.yaw);
  camera.lookAt(camera.position.x + dx * c + dz * s, view.target.y, camera.position.z - dx * s + dz * c);
}
window.addEventListener("resize", () => {
  if (G.phase === "map") { mapResize(); } else { fitCamera(); }
});

function updateWaves(time) {
  const pos = waterGeo.attributes.position.array;
  const A = 0.016 + 0.01 * G.rain;
  for (let i = 0; i < pos.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2] - 8;
    pos[i + 1] = A * (Math.sin(x * 2.1 + time * 1.3) + 0.7 * Math.sin(z * 2.7 - time * 1.05) + 0.35 * Math.sin((x + z) * 4.6 + time * 2.3));
  }
  rippleTex.offset.set(time * 0.006, time * 0.004);
  waterGeo.attributes.position.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

function stepRoom(dt, time) {
  const b = BLD[G.house];

  if (G.auto > 0 && G.phase === "room") { G.pending += G.auto * dt; G.lastRub = performance.now(); }
  if (G.phase === "room") {
    /* こすった量はそのまま、雨への変わり方だけ段階で変える。cap（雨の強さの見え方の基準）は変えない */
    const k = paceNow();
    const cap = CONFIG.rub.maxMmPerSec * dt;
    const raw = Math.min(G.pending * CONFIG.rub.mmPerScreen, cap);
    const add = raw * k;
    G.pending = 0;
    G.mm = Math.min(MM_MAX, G.mm + add);
    /* 雨の見た目の強さは、こすった速さのまま */
    const inst = cap > 0 ? raw / cap : 0;
    G.intensity += (inst - G.intensity) * Math.min(1, dt * (inst > G.intensity ? 6 : 1.5));
    if (G.mm >= MM_MAX && !G.hold) startEnding();
  } else {
    G.intensity += (0 - G.intensity) * Math.min(1, dt * 1.5);
  }

  /* 水位：雨の量で決まる深さに、少しずつ追いつく */
  if (G.phase === "drain") {
    G.drainT += dt;
    const k = Math.min(1, G.drainT / CONFIG.drainSec);
    G.depth = G.drainFrom * (1 - k * k * (3 - 2 * k));
    if (k >= 1) showResult();
  } else if (G.phase !== "result") {
    const target = depthForRain(G.mm, b);
    /* 一言を読んでいる間は、水の上がり方もゆるめる */
    const step = CONFIG.waterSpeed * dt * waterPaceNow();
    G.depth += Math.max(-step, Math.min(step, target - G.depth));
    G.maxDepth = Math.max(G.maxDepth, G.depth);
    if (G.phase === "ending") {
      if (Math.abs(target - G.depth) < 0.01) G.endT += dt;
      /* 一言を全部読み終わってから水を引かせる */
      if (G.endT > 1.6 && !isReading()) startDrain();
    }
    checkLines(false);
    pumpLines();
  }

  /* 雨の強さ（こすっていないときも、雨が始まっていれば少し降る） */
  const floor = G.phase === "room" || G.phase === "ending" ? (G.mm > 0 ? 0.14 : 0.05) : 0.03;
  G.rain = Math.max(floor, G.intensity);
  updateRain(dt, G.rain);
  updateAudio(G.phase === "map" ? 0 : G.rain);
  const wetTarget = G.phase === "drain" || G.phase === "result" ? 0.2 : (G.mm > 0 ? 0.2 + 0.8 * G.rain : 0.08);
  G.wet += (wetTarget - G.wet) * Math.min(1, dt * 0.8);
  dropMat.opacity = G.wet;
  dropTex.offset.y += dt * 0.02 * G.rain;

  G.flash = Math.max(0, G.flash - dt / 1.6);
  const dark = Math.min(0.92, 0.12 + 0.3 * Math.min(1, G.mm / MM_MAX) + 0.4 * G.rain + 0.35 * Math.sin(Math.PI * Math.min(1, G.flash * 1.2)));
  scene.background.copy(SKY_LIGHT).lerp(SKY_DARK, dark);
  scene.fog.color.copy(scene.background);
  scene.fog.far = 95 - 45 * G.rain;
  updateRipples(dt, G.phase === "drain" || G.phase === "result" ? 0.05 : G.rain, G.depth > 0.001 ? G.depth - FH : -1e9);
  hemi.intensity = BASE.hemi * (1 - 0.45 * dark);
  sun.intensity = BASE.sun * (1 - 0.7 * dark);

  applyScene(dt, time);

  /* 画面の数字 */
  elRain.textContent = Math.floor(G.mm);
  const st = stepAt(G.mm);
  elRainSub.textContent = st ? st.label : "";
  elFill.style.width = (G.mm / MM_MAX * 100).toFixed(2) + "%";
  RAIN_STEPS.forEach((s, i) => tickEls[i].classList.toggle("on", G.mm >= s.mm));
  /* 水が引く場面と結果では、引いた後の0mではなく一番深いときの値を出す */
  const after = G.phase === "drain" || G.phase === "result";
  el("depthLab").textContent = after ? "一番深いとき" : (G.mode === "window" ? "建物のまわりの水" : "この家の水の深さ");
  elDepth.textContent = (after ? G.maxDepth : G.depth).toFixed(2);
  elHint.style.opacity = G.phase === "room" && G.mm < 15 ? 1 : 0;
  const showStop = G.phase === "room" && G.mm > 0 && G.mm < MM_MAX && performance.now() - G.lastRub > 1200;
  elStop.classList.toggle("hide", !showStop);
}

function applyScene(dt, time) {
  const level = G.depth - FH;
  const maxLevel = G.maxDepth - FH;

  water.visible = G.depth > 0.001;
  if (water.visible) {
    water.position.y = level;
    /* 目の高さに近づくと水面の筋が横に伸びて見えるので、弱める */
    waterMat.emissiveIntensity = Math.max(0.2, 1 - Math.max(0, level) / 2.2);
    updateWaves(time);
  }

  /* 電気：コンセントが水につかったら、もう戻らない */
  const powerOn = G.maxDepth < FH1 + H.outlet;
  for (const m of OUT_LIGHTS) m.emissiveIntensity = powerOn ? 0.55 : 0;
  lampMat.emissiveIntensity = powerOn ? 0.9 : 0;
  lampMat.color.setHex(powerOn ? 0xffffff : 0xc9ced1);
  tvScreenMat.emissiveIntensity = powerOn ? 1 : 0;
  roomLight.intensity = powerOn ? 0.38 : 0;

  /* 壁の時計：雨の量に合わせて進み、水につかると止まる */
  const mins = G.clockStop !== null ? G.clockStop : clockMinutes();
  clockHands.m.rotation.z = -((mins % 60) / 60) * Math.PI * 2;
  clockHands.h.rotation.z = -(((mins / 60) % 12) / 12) * Math.PI * 2;

  /* ローテーブル：浮いて、少し流される。水が引くとずれた所に残る */
  const floating = level > H.tableFloat;
  if (floating) G.floatT += dt;
  if (G.floatT > 0) {
    const k = 1 - Math.exp(-G.floatT / 5);
    const lift = floating ? level - H.tableFloat : 0;
    const bob = floating ? 0.008 * Math.sin(time * 1.6) : 0;
    table.position.set(TABLE_BASE.x + 0.2 * k, lift + bob, TABLE_BASE.z - 0.9 * k);
    table.rotation.set(floating ? 0.02 * Math.sin(time * 1.3) : 0, 0.55 * k, floating ? 0.02 * Math.sin(time * 1.1 + 1) : 0);
  }

  /* 泥の跡：一番高く来た所まで、水が下がってから見える */
  const showStain = maxLevel > 0.01 && level < maxLevel - 0.01;
  const sh = Math.min(maxLevel, CH);
  for (const s of stains) {
    s.p.visible = s.l.visible = showStain;
    if (showStain) { s.p.scale.y = sh; s.p.position.y = sh / 2; s.l.position.y = sh; }
  }
  floorMud.visible = maxLevel > 0 && level < 0;

  /* 水面が目の高さを越えたら、濁った水の中の見え方にする */
  el("under").style.opacity = G.mode === "sink" && level > EYE - 0.02 ? 1 : 0;
}

/* =====================================================================
   始まり。確かめ用に、アドレスの後ろで場面を指定できる
   ?pick=番号 … 地図でその建物を選んだ状態
   ?b=番号&mm=雨の量 … その家の居間を、その雨の量で開く（自動で終わらない）
   ?b=番号&mm=雨の量&end=1 … 結果の画面
   ?addr=住所 … 住所の欄にその住所を入れて候補を出した状態（&go=1 で1つ目の候補を選ぶ）
   ?yaw=角度（ラジアン） … 地図を回した状態（方位磁針の確かめ用）
   ===================================================================== */
if (!/[?&]b=/.test(location.search)) ensureMapBuildings();
mapResize();
mapFit();
{
  const P = new URLSearchParams(location.search);
  const bi = parseInt(P.get("b"), 10);
  const pk = parseInt(P.get("pick"), 10);
  if (bi >= 0 && bi < BLD.length) {
    enterRoom(bi, parseInt(P.get("f"), 10) || 1);
    /* ?auto=1秒にこする画面の数 … 自動でこすり続ける（流れの時間の確かめ用。__lineLog に一言の記録が残る） */
    if (P.has("auto")) { G.auto = parseFloat(P.get("auto")) || 0; window.__lineLog = []; window.__t0 = performance.now(); }
    if (P.has("mm")) {
      const mm = Math.max(0, Math.min(MM_MAX, parseFloat(P.get("mm")) || 0));
      G.mm = mm;
      G.hold = true;
      G.depth = G.maxDepth = depthForRain(mm, BLD[bi]);
      let last = -1;
      RAIN_STEPS.forEach((s, i) => { if (mm >= s.mm) last = i; });
      /* ここまでの一言は出さずに済ませ、最後の目盛りの一言だけ出す */
      checkLines(true);
      G.alertIdx = -1;
      { const ra = riverAlerts(BLD[bi]); for (let i = 0; i < ra.length; i++) if (mm >= ra[i].mm) G.alertIdx = i; }
      if (P.get("alert") === "1" && G.alertIdx >= 0) showAlert(riverAlerts(BLD[bi])[G.alertIdx]);
      G.stepIdx = Math.max(-1, last - 1);
      const lv = G.depth - FH;
      if (lv > H.tableFloat) G.floatT = 4;
      if (lv >= H.clock) G.clockStop = clockMinutes();
      if (mm > 0) { G.lastRub = -1e9; G.rain = 0.14; G.wet = 0.6; }
      if (P.get("end") === "1") { G.depth = 0; G.floatT = Math.max(G.floatT, 0); showResult(); }
    }
  } else if (pk >= 0 && pk < BLD.length) {
    const b = BLD[pk];
    mapCtl.tx = mX((b.x0 + b.x1) / 2);
    mapCtl.tz = mZ((b.y0 + b.y1) / 2);
    mapCtl.dist = 650;
    placeMapCam();
    selectBuilding(pk);
  }
  if (P.has("yaw")) { mapCtl.yaw = parseFloat(P.get("yaw")) || 0; placeMapCam(); }
  if (P.has("addr")) {
    addrIn.value = P.get("addr");
    addrUpdate();
    if (P.get("go") === "1" && addrCands.length) addrGo(addrCands[0]);
  }
}

let lastNow = performance.now();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  if (G.phase === "map") {
    /* 地図は、動かしたときだけ描き直す */
    if (mapNeedsRender) { mapNeedsRender = false; renderMap(); }
  } else {
    stepRoom(dt, now / 1000);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
